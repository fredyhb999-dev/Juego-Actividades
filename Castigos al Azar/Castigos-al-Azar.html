<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Castigos al Azar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    user-select: none;
  }

  #inicio, #estado{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    text-align:center;
    padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
  }

  #estado{ display:none; overflow-y:auto; }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size: .78rem;
    letter-spacing: .35em;
    color: var(--fg-muted);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: .02em;
    margin: 0 0 8px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule{
    width: 64px; height: 3px; margin: 6px auto 26px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border-radius: 2px;
  }

  p.desc{
    font-size: .92rem;
    color: var(--fg-muted);
    max-width: 320px;
    margin: 0 0 34px;
    line-height: 1.5;
  }

  #btnInicio{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: .08em;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border: none;
    border-radius: 14px;
    padding: 18px 46px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
    box-shadow: 0 10px 30px -10px var(--coral-glow);
  }
  #btnInicio:active{ transform: scale(.96); }
  #btnInicio:disabled{ opacity:.5; cursor:default; }

  #msgInicio{
    margin-top: 22px;
    font-size: .88rem;
    color: var(--coral);
    min-height: 20px;
    max-width: 300px;
  }

  .rangos{
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .rango{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .rango label{
    font-size: .74rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .rango input{
    width: 82px;
    text-align: center;
    font-size: 1.2rem;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px;
    outline: none;
  }
  .rango input:focus{ border-color: var(--teal); }

  .modos{
    display: flex;
    margin-bottom: 24px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
  }
  .modo{
    font-family:'Chakra Petch', sans-serif;
    font-size:.95rem;
    letter-spacing:.04em;
    padding: 10px 28px;
    background: transparent;
    color: var(--fg-muted);
    border: none;
    cursor: pointer;
  }
  .modo.activo{
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
  }

  /* --- pantalla de reproducción --- */
  .pulso-wrap{
    width:120px; height:120px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle, var(--card) 55%, transparent 100%);
    margin-bottom: 28px;
    position: relative;
  }
  .pulso-wrap::before, .pulso-wrap::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    border: 2px solid var(--teal);
    opacity: 0;
    animation: pulso 2.4s ease-out infinite;
  }
  .pulso-wrap::after{ animation-delay: 1.2s; }
  @keyframes pulso{
    0%{ transform:scale(.7); opacity:.7; }
    100%{ transform:scale(1.6); opacity:0; }
  }
  .icono-audio{ font-size: 2.4rem; z-index:1; }

  #nombreAudio{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.5rem;
    margin-top:14px;
    max-width:90%;
    word-break:break-word;
    width: fit-content;
    margin-left:auto; margin-right:auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.25;
  }
  #estadoPlayer{
    font-size:1rem; margin-top:12px; color:var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }
  #contador{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:2.4rem;
    margin-top:10px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #contador.hidden{ display:none; }
  #siguiente{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600; letter-spacing:.08em; font-size:.85rem;
    text-transform:uppercase;
    color:var(--teal);
    padding:10px 20px;
    border:1px solid var(--card-border); border-radius:12px;
    background: var(--card);
    cursor:pointer;
    margin-top:14px;
  }
  #siguiente:active{ transform:scale(.97); }

  #estado .title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size: 1.3rem;
    letter-spacing:.03em;
  }
  #estado .subtitle{
    margin-top:8px;
    font-size:.85rem;
    color: var(--fg-muted);
  }
</style>
</head>
<body>

<div id="inicio">
  <p class="eyebrow">Castigos al Azar</p>
  <h1>Reproductor Aleatorio</h1>
  <div class="rule"></div>
  <p class="desc">Elige audio o texto. En los dos casos reproduce un castigo al azar, con pausas variables entre cada uno.</p>

  <div class="modos">
    <button type="button" class="modo activo" data-modo="audio" aria-pressed="true">Audio</button>
    <button type="button" class="modo" data-modo="texto" aria-pressed="false">Texto</button>
  </div>

  <div class="rangos">
    <div class="rango">
      <label for="minMinutos">Mínimo</label>
      <input id="minMinutos" type="number" min="0" step="0.5" value="5" inputmode="decimal">
    </div>
    <div class="rango">
      <label for="maxMinutos">Máximo</label>
      <input id="maxMinutos" type="number" min="0" step="0.5" value="10" inputmode="decimal">
    </div>
  </div>

  <button id="btnInicio">INICIAR</button>
  <div id="msgInicio"></div>
</div>

<div id="estado">
  <div class="pulso-wrap"><span class="icono-audio">🔊</span></div>
  <div class="title">Reproduciendo...</div>
  <div class="subtitle">Frases aleatorias en curso</div>
  <div id="nombreAudio"></div>
  <div id="estadoPlayer"></div>
  <div id="contador" class="hidden"></div>
  <button id="siguiente">⏭ Siguiente</button>
</div>

<audio id="player"></audio>

<script>
//==============================
// CONFIGURA AQUÍ TU REPOSITORIO
//==============================
const USUARIO = "fredyhb999-dev";
const REPO    = "Juego-Actividades";
const CARPETA = "Castigos al Azar";
const ARCHIVO_TEXTOS = "Castigos al Azar.json";
//==============================

const player = document.getElementById("player");
const btnInicio = document.getElementById("btnInicio");
const msgInicio = document.getElementById("msgInicio");
const minInput = document.getElementById("minMinutos");
const maxInput = document.getElementById("maxMinutos");
const botonesModo = Array.from(document.querySelectorAll(".modo"));

const icono = document.querySelector(".icono-audio");
const nombreEl = document.getElementById("nombreAudio");
const estadoPlayer = document.getElementById("estadoPlayer");
const contador = document.getElementById("contador");
const btnSiguiente = document.getElementById("siguiente");

let audios = [];
let textos = [];
let ultimoAudio = -1;
let ultimoTexto = -1;
let modoActual = "audio";
let wakeLock = null;
let pausaMin = 5;
let pausaMax = 10;

let detenido = false;
let enEspera = false;
let reproduciendo = false;
let pausadoManual = false;
let resolveReproduccion = null;
let resolveEspera = null;
let saltarFlag = false;
let intervalo = null;
let tiempoRestante = 0;
let ttsFallback = null;

botonesModo.forEach(boton=>{
    boton.addEventListener("click",()=>{
        modoActual = boton.dataset.modo;
        botonesModo.forEach(b=>{
            const activo = (b===boton);
            b.classList.toggle("activo",activo);
            b.setAttribute("aria-pressed",activo ? "true" : "false");
        });
    });
});

// Despierta la lista de voces del teléfono antes de usarla.
if("speechSynthesis" in window){
    speechSynthesis.getVoices();
}

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){
    const n=nombreArchivo.toLowerCase();
    return extensionesAudio.some(ext=>n.endsWith(ext));
}

function nombreVisible(n){
    const p=n.lastIndexOf(".");
    return p>0 ? n.substring(0,p) : n;
}

function seg_a_mmss(s){
    const m=Math.floor(s/60);
    const ss=s%60;
    return m+":"+String(ss).padStart(2,"0");
}

//---------------------------------------------
async function cargarAudios(){
    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(CARPETA);
    const res=await fetch(url);
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta");
    }
    const datos=await res.json();
    const lista=datos.filter(item=>item.type==="file" && esAudio(item.name));
    return lista.map(item=>({ url: item.download_url, nombre: nombreVisible(item.name) }));
}
//---------------------------------------------
async function mantenerPantallaActiva(){
    if(!("wakeLock" in navigator))
        return;
    try{
        wakeLock = await navigator.wakeLock.request("screen");
    }catch(e){}
}
//---------------------------------------------
document.addEventListener("visibilitychange", async ()=>{
    if(!document.hidden){
        mantenerPantallaActiva();
    }
});
//---------------------------------------------
function obtenerAudioAleatorio(){
    if(audios.length===1){
        ultimoAudio=0;
        return 0;
    }
    let indice;
    do{
        indice=Math.floor(Math.random()*audios.length);
    }while(indice===ultimoAudio);
    ultimoAudio=indice;
    return indice;
}
//---------------------------------------------
function reproducirAudio(src, nombre){
    return new Promise(resolve=>{
        resolveReproduccion = resolve;
        player.src = src;
        player.onended = () => { if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion=null; } };
        player.onerror = () => { if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion=null; } };
        player.play().catch(() => { if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion=null; } });
        nombreEl.textContent = nombre;
        estadoPlayer.textContent = "Reproduciendo";
        icono.textContent = "🔊";
        pausadoManual = false;
        reproduciendo = true;
    });
}
//---------------------------------------------
// Texto: las acciones se leen con la voz del teléfono
//---------------------------------------------
async function cargarTextos(){
    const res=await fetch(encodeURIComponent(ARCHIVO_TEXTOS),{cache:"no-store"});
    if(!res.ok){
        throw new Error("No se pudo leer "+ARCHIVO_TEXTOS);
    }
    const datos=await res.json();
    if(!Array.isArray(datos)){
        throw new Error("El archivo de textos no es una lista");
    }
    return datos
        .filter(texto=>typeof texto==="string" && texto.trim().length>0)
        .map(texto=>texto.trim());
}
//---------------------------------------------
function obtenerTextoAleatorio(){
    if(textos.length===1){
        ultimoTexto=0;
        return 0;
    }
    let indice;
    do{
        indice=Math.floor(Math.random()*textos.length);
    }while(indice===ultimoTexto);
    ultimoTexto=indice;
    return indice;
}
//---------------------------------------------
function esVozFemenina(voz){
    const n=String(voz.name || "").toLowerCase();
    if(/female|femenina|mujer|woman/.test(n)) return true;
    const nombres=["paulina","monica","mónica","marisol","sabina","helena","laura","maria","maría","carmen","lucia","lucía","elvira","penelope","penélope","esperanza","ximena","valeria","dalia","camila","gabriela","isabela","sofia","sofía","lupe","guadalupe","angela","ángela","irene","soledad","conchita","teresa","juana","veronica","verónica","alejandra","fernanda","renata","julia","julieta","diana","claudia","patricia","silvia","rocio","rocío","lorena","miriam","nuria"];
    return nombres.some(nombre=>n.includes(nombre));
}

function vozEnEspanol(){
    if(!("speechSynthesis" in window)){
        return null;
    }
    const voces=speechSynthesis.getVoices();
    const normal=voz=>String(voz.lang || "").toLowerCase().replace("_","-");
    const paises=["es-mx","es-us","es-419"];

    for(const pref of paises){
        const voz=voces.find(v=>normal(v).startsWith(pref) && esVozFemenina(v));
        if(voz) return voz;
    }
    const femenina=voces.find(voz=>normal(voz).startsWith("es") && esVozFemenina(voz));
    if(femenina) return femenina;

    for(const pref of paises){
        const voz=voces.find(v=>normal(v).startsWith(pref));
        if(voz) return voz;
    }
    return voces.find(voz=>normal(voz).startsWith("es")) || null;
}
//---------------------------------------------
function reproducirTexto(texto){
    return new Promise(resolve=>{
        nombreEl.textContent = texto;
        estadoPlayer.textContent = "Leyendo...";
        icono.textContent = "🔊";
        pausadoManual = false;
        reproduciendo = true;

        if(window.Sonido && !window.Sonido.activo()){
            estadoPlayer.textContent = "Silenciado";
            setTimeout(resolve,1200);
            return;
        }
        if(!("speechSynthesis" in window)){
            setTimeout(resolve,1500);
            return;
        }

        resolveReproduccion = resolve;
        const frase=new SpeechSynthesisUtterance(texto);
        const voz=vozEnEspanol();
        if(voz){
            frase.voice=voz;
            frase.lang=voz.lang;
        }else{
            frase.lang="es-MX";
        }
        frase.rate=1;
        frase.onend = () => {
            if(ttsFallback){ clearTimeout(ttsFallback); ttsFallback=null; }
            if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion=null; }
        };
        frase.onerror = () => {
            if(ttsFallback){ clearTimeout(ttsFallback); ttsFallback=null; }
            if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion=null; }
        };
        speechSynthesis.speak(frase);

        // Resguardo por si el navegador no avisa que terminó.
        if(ttsFallback) clearTimeout(ttsFallback);
        ttsFallback = setTimeout(() => {
            if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion=null; }
        }, 3000 + texto.length*110);
    });
}
//---------------------------------------------
function esperar(minutos){
    return new Promise(resolve=>{
        if(saltarFlag){ saltarFlag=false; resolve(); return; }
        resolveEspera = resolve;
        iniciarCuenta(minutos);
    });
}
//---------------------------------------------
function iniciarCuenta(minutos){
    clearInterval(intervalo);
    tiempoRestante = Math.max(1, Math.round(minutos*60));
    contador.className = "";
    contador.textContent = seg_a_mmss(tiempoRestante);
    estadoPlayer.textContent = "Siguiente audio en";
    pausadoManual = false;
    intervalo = setInterval(()=>{
        if(detenido){ clearInterval(intervalo); intervalo=null; if(resolveEspera){resolveEspera(); resolveEspera=null;} return; }
        if(pausadoManual) return;
        tiempoRestante--;
        if(tiempoRestante <= 0){
            clearInterval(intervalo); intervalo=null;
            contador.className = "hidden";
            if(resolveEspera){ resolveEspera(); resolveEspera=null; }
        }else{
            contador.textContent = seg_a_mmss(tiempoRestante);
        }
    }, 1000);
}
//---------------------------------------------
async function iniciar(){
    detenido = false;
    while(!detenido){
        if(modoActual==="texto"){
            const indice = obtenerTextoAleatorio();
            await reproducirTexto(textos[indice]);
        }else{
            const indice = obtenerAudioAleatorio();
            const a = audios[indice];
            await reproducirAudio(a.url, a.nombre);
        }
        reproduciendo = false;
        if(detenido) break;

        enEspera = true;
        const pausa = pausaMin + Math.random()*(pausaMax - pausaMin);
        await esperar(pausa);
        enEspera = false;
        if(detenido) break;
    }
}
//---------------------------------------------
btnInicio.addEventListener("click", async ()=>{

    const minValor = parseFloat(minInput.value);
    const maxValor = parseFloat(maxInput.value);

    if(isNaN(minValor) || minValor < 0){
        msgInicio.textContent = "Escribe un mínimo válido (0 o más).";
        return;
    }
    if(isNaN(maxValor) || maxValor < 0){
        msgInicio.textContent = "Escribe un máximo válido (0 o más).";
        return;
    }
    if(maxValor < minValor){
        msgInicio.textContent = "El máximo debe ser igual o mayor que el mínimo.";
        return;
    }

    pausaMin = minValor;
    pausaMax = maxValor;

    btnInicio.disabled=true;

    if(modoActual==="texto"){
        msgInicio.textContent="Cargando textos...";
        try{
            textos = await cargarTextos();
        }catch(e){
            msgInicio.textContent="No se encontró el archivo \u201C"+ARCHIVO_TEXTOS+"\u201D.";
            btnInicio.disabled=false;
            return;
        }
        if(textos.length===0){
            msgInicio.textContent="El archivo de textos está vacío.";
            btnInicio.disabled=false;
            return;
        }
    }else{
        msgInicio.textContent="Cargando lista de audios...";
        try{
            audios = await cargarAudios();
        }catch(e){
            msgInicio.textContent="Error al cargar los audios. Revisa tu conexión.";
            btnInicio.disabled=false;
            return;
        }
        if(audios.length===0){
            msgInicio.textContent="No se encontraron audios en la carpeta.";
            btnInicio.disabled=false;
            return;
        }
    }

    document.getElementById("inicio").style.display="none";
    document.getElementById("estado").style.display="flex";

    const tituloEstado=document.querySelector("#estado .title");
    const subEstado=document.querySelector("#estado .subtitle");
    if(modoActual==="texto"){
        tituloEstado.textContent="Leyendo...";
        subEstado.textContent="Castigos aleatorios en curso";
    }else{
        tituloEstado.textContent="Reproduciendo...";
        subEstado.textContent="Frases aleatorias en curso";
    }

    // Se solicita mantener la pantalla encendida.
    mantenerPantallaActiva();

    detenido = false;
    enEspera = false;
    reproduciendo = false;
    pausadoManual = false;

    // Se inicia inmediatamente la reproducción.
    iniciar();
});

// Tap en cualquier parte para pausar / reanudar.
document.getElementById("estado").onclick = (e) => {
    if(detenido) return;
    if(e.target && e.target.id === "siguiente") return;

    if(enEspera){
        pausadoManual = !pausadoManual;
        icono.textContent = pausadoManual ? "▶" : "⏳";
        estadoPlayer.textContent = pausadoManual ? "En pausa" : "Siguiente audio en";
    } else if(reproduciendo){
        if(modoActual === "audio"){
            if(player.paused){
                player.play();
                icono.textContent = "🔊";
                estadoPlayer.textContent = "Reproduciendo";
            }else{
                player.pause();
                icono.textContent = "▶";
                estadoPlayer.textContent = "En pausa";
            }
        }else{
            if("speechSynthesis" in window){
                if(speechSynthesis.paused){
                    speechSynthesis.resume();
                    icono.textContent = "🔊";
                    estadoPlayer.textContent = "Leyendo...";
                }else{
                    speechSynthesis.pause();
                    icono.textContent = "▶";
                    estadoPlayer.textContent = "En pausa";
                }
            }
        }
    }
};

btnSiguiente.onclick = (e) => {
    e.stopPropagation();
    if(detenido) return;
    player.pause();
    if("speechSynthesis" in window) speechSynthesis.cancel();
    if(enEspera){
        clearInterval(intervalo);
        intervalo = null;
        if(resolveEspera){ resolveEspera(); resolveEspera = null; }
    }else{
        saltarFlag = true;
        if(resolveReproduccion){ resolveReproduccion(); resolveReproduccion = null; }
    }
};
</script>
<script src="../js/volver.js" data-padre="../Audios.html"></script>
<script src="../js/sonido.js"></script>
</body>
</html>
