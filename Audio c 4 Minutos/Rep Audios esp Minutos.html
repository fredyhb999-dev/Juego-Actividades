<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rep Audios esp Minutos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
    --wait-glow: rgba(165, 153, 199, .35);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    user-select:none;
  }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:14px;
  }

  /* ---------- pantalla de configuración ---------- */
  #config{
    height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  #config h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 10px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #config p{
    font-size:.88rem; color:var(--fg-muted); max-width:320px; margin:0 0 26px;
  }
  #config input{
    width:100%; max-width:200px;
    font-size:1.4rem; text-align:center;
    padding:12px; margin-bottom:22px;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
  }
  #config button{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; letter-spacing:.06em; font-size:1.05rem;
    width:100%; max-width:260px;
    padding:16px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none; border-radius:14px;
    cursor:pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  #config button:active{ transform: scale(.97); }
  #config button:disabled{ opacity:.4; cursor:default; }
  #configMsg{
    margin-top:14px; font-size:.85rem; color:var(--coral); min-height:18px;
  }

  /* ---------- pantalla de reproducción ---------- */
  #player{
    display:none;
    height:100dvh; width:100vw;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    transition: background-color .4s ease, box-shadow .4s ease;
    cursor:pointer;
  }
  #player.playing{ box-shadow: inset 0 0 140px var(--teal-glow); }
  #player.paused{ box-shadow: inset 0 0 140px var(--coral-glow); }
  #player.esperando{ box-shadow: inset 0 0 140px var(--wait-glow); }

  #icono{
    font-size:100px;
    line-height:1;
    margin-bottom:10px;
  }
  #nombreAudio{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.7rem; margin-top:15px;
    max-width:90%;
    word-break:break-word;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #estadoPlayer{
    font-size:1.05rem; margin-top:14px; color: var(--fg-muted);
  }
  #info{
    position:absolute; bottom:max(26px, env(safe-area-inset-bottom));
    font-size:.8rem; color: var(--fg-muted); opacity:.7;
    text-align:center;
  }
</style>
</head>

<body>

<div id="config">
  <div class="eyebrow">Rep Audios esp Minutos</div>
  <h1>Minutos entre cada audio</h1>
  <p>Elige cada cuántos minutos quieres que se reproduzca un nuevo audio.</p>
  <input id="minutos" type="number" min="1" step="1" value="4" inputmode="numeric">
  <button id="btnIniciar">Iniciar</button>
  <div id="configMsg"></div>
</div>

<div id="player">
  <div id="icono">⏸</div>
  <div id="nombreAudio"></div>
  <div id="estadoPlayer"></div>
  <div id="info">
    Toca cualquier parte de la pantalla
    <br>
    para Pausar / Reanudar
  </div>
</div>

<audio id="audio"></audio>

<script>

//==============================
// CONFIGURA AQUÍ TU REPOSITORIO
//==============================
const USUARIO = "fredyhb999-dev";
const REPO    = "Juego-Actividades";
const CARPETA = "Audio c 4 Minutos";
//==============================

const configEl=document.getElementById("config");
const minutosInput=document.getElementById("minutos");
const btnIniciar=document.getElementById("btnIniciar");
const configMsg=document.getElementById("configMsg");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const icono=document.getElementById("icono");
const nombre=document.getElementById("nombreAudio");
const estadoPlayer=document.getElementById("estadoPlayer");

let listaOriginal=[];
let bolsa=[];
let minutosEspera=4;
let wakeLock=null;
let pausadoManual=false;
let temporizador=null;
let ultimoUrl=null;

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){
    const n=nombreArchivo.toLowerCase();
    return extensionesAudio.some(ext=>n.endsWith(ext));
}

function nombreVisible(n){
    const p=n.lastIndexOf(".");
    return p>0 ? n.substring(0,p) : n;
}

//---------------------------------------------
async function mantenerPantalla(){
    try{
        if('wakeLock' in navigator){
            wakeLock=await navigator.wakeLock.request('screen');
            wakeLock.addEventListener("release",()=>{});
        }
    }catch(e){}
}

document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible" && wakeLock==null){
        await mantenerPantalla();
    }
});

//---------------------------------------------
async function cargarAudios(){
    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(CARPETA);
    const res=await fetch(url);
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta");
    }
    const datos=await res.json();
    const lista=datos.filter(item=>item.type==="file" && esAudio(item.name));
    lista.sort((a,b)=>a.name.localeCompare(b.name,"es"));
    return lista.map(item=>({nombre:nombreVisible(item.name),url:item.download_url}));
}

//---------------------------------------------
function mezclar(arr){
    const copia=arr.slice();
    for(let i=copia.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copia[i],copia[j]]=[copia[j],copia[i]];
    }
    return copia;
}

function siguienteAudio(){
    if(bolsa.length===0){
        bolsa=mezclar(listaOriginal);
        // Evita repetir el último audio del ciclo anterior justo al inicio del nuevo
        if(bolsa.length>1 && bolsa[0].url===ultimoUrl){
            [bolsa[0],bolsa[1]]=[bolsa[1],bolsa[0]];
        }
    }
    const siguiente=bolsa.shift();
    ultimoUrl=siguiente.url;
    return siguiente;
}

//---------------------------------------------
function reproducir(item){

    audio.pause();
    audio.src=item.url;
    audio.load();

    audio.play()
    .then(()=>{
        player.className="playing";
        icono.textContent="⏸";
        nombre.textContent=item.nombre;
        estadoPlayer.textContent="Reproduciendo";
    })
    .catch(()=>{
        // Si un audio falla, intenta con el siguiente
        programarSiguiente(0);
    });

}

function programarSiguiente(minutos){
    player.className="esperando";
    icono.textContent="⏳";
    estadoPlayer.textContent="Siguiente audio en unos momentos...";
    clearTimeout(temporizador);
    temporizador=setTimeout(()=>{
        if(!pausadoManual){
            const item=siguienteAudio();
            reproducir(item);
        }
    },minutos*60*1000);
}

audio.onended=()=>{
    if(!pausadoManual){
        programarSiguiente(minutosEspera);
    }
};

audio.onerror=()=>{
    programarSiguiente(0);
};

//---------------------------------------------
player.onclick=()=>{

    if(player.className==="esperando"){
        return; // mientras espera el próximo audio, no hace nada al tocar
    }

    if(audio.paused){
        audio.play();
        player.className="playing";
        icono.textContent="⏸";
        estadoPlayer.textContent="Reproduciendo";
        pausadoManual=false;
    }else{
        audio.pause();
        player.className="paused";
        icono.textContent="▶";
        estadoPlayer.textContent="Pausado";
        pausadoManual=true;
    }

};

//---------------------------------------------
btnIniciar.onclick=async()=>{

    const minutosValor=parseInt(minutosInput.value,10);

    if(!minutosValor || minutosValor<1){
        configMsg.textContent="Escribe un número válido de minutos.";
        return;
    }

    minutosEspera=minutosValor;
    configMsg.textContent="Cargando lista de audios...";
    btnIniciar.disabled=true;

    try{
        listaOriginal=await cargarAudios();
    }catch(e){
        configMsg.textContent="Error al cargar los audios. Revisa tu conexión.";
        btnIniciar.disabled=false;
        return;
    }

    if(listaOriginal.length===0){
        configMsg.textContent="No se encontraron audios en la carpeta.";
        btnIniciar.disabled=false;
        return;
    }

    bolsa=[];
    pausadoManual=false;

    await mantenerPantalla();

    configEl.style.display="none";
    player.style.display="flex";

    const item=siguienteAudio();
    reproducir(item);

};

</script>

</body>
</html>
