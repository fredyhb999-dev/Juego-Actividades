<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor Automático</title>
<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#f2f2f2;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#inicio,
#player{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

#player{
    display:none;
    cursor:pointer;
    user-select:none;
    transition:.25s;
}

#player.playing{
    background:#1d3557;
    color:white;
}

#player.paused{
    background:#555;
    color:white;
}

#player.esperando{
    background:#8d99ae;
    color:white;
}

h2{
    margin-bottom:20px;
    text-align:center;
}

input{
    width:100%;
    max-width:300px;
    font-size:22px;
    padding:14px;
    margin-top:10px;
    margin-bottom:20px;
    text-align:center;
}

button{
    font-size:22px;
    padding:14px 30px;
}

#icono{
    font-size:120px;
}

#nombreAudio{
    margin-top:25px;
    font-size:24px;
    text-align:center;
    word-break:break-word;
}

#mensaje{
    margin-top:20px;
    color:red;
    text-align:center;
    min-height:28px;
}

#info{
    margin-top:35px;
    font-size:18px;
    opacity:.8;
    text-align:center;
}

</style>
</head>

<body>

<div id="inicio">

<h2>Minutos entre cada audio</h2>

<input
id="minutos"
type="number"
min="1"
step="1"
value="4"
inputmode="numeric">

<button id="btnIniciar">Iniciar</button>

<div id="mensaje"></div>

</div>

<div id="player">

<div id="icono">⏸</div>

<div id="nombreAudio"></div>

<div id="info">
Toca cualquier parte de la pantalla
<br>
para Pausar / Reanudar
</div>

</div>

<audio id="audio"></audio>

<script>

//==============================
// CONFIGURA AQUÍ TU REPOSITORIO
//==============================
const USUARIO = "fredyhb999-dev";
const REPO    = "Juego-Actividades";
const CARPETA = "Audio c 4 Minutos";
//==============================

const inicio=document.getElementById("inicio");
const minutosInput=document.getElementById("minutos");
const btnIniciar=document.getElementById("btnIniciar");
const mensaje=document.getElementById("mensaje");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const icono=document.getElementById("icono");
const nombre=document.getElementById("nombreAudio");

let listaOriginal=[];
let bolsa=[];
let minutosEspera=4;
let wakeLock=null;
let pausadoManual=false;
let temporizador=null;

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){
    const n=nombreArchivo.toLowerCase();
    return extensionesAudio.some(ext=>n.endsWith(ext));
}

function nombreVisible(n){
    const p=n.lastIndexOf(".");
    return p>0 ? n.substring(0,p) : n;
}

//---------------------------------------------
async function mantenerPantalla(){
    try{
        if('wakeLock' in navigator){
            wakeLock=await navigator.wakeLock.request('screen');
            wakeLock.addEventListener("release",()=>{});
        }
    }catch(e){}
}

document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible" && wakeLock==null){
        await mantenerPantalla();
    }
});

//---------------------------------------------
async function cargarAudios(){
    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(CARPETA);
    const res=await fetch(url);
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta");
    }
    const datos=await res.json();
    const lista=datos.filter(item=>item.type==="file" && esAudio(item.name));
    lista.sort((a,b)=>a.name.localeCompare(b.name,"es"));
    return lista.map(item=>({nombre:nombreVisible(item.name),url:item.download_url}));
}

//---------------------------------------------
function mezclar(arr){
    const copia=arr.slice();
    for(let i=copia.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copia[i],copia[j]]=[copia[j],copia[i]];
    }
    return copia;
}

function siguienteAudio(){
    if(bolsa.length===0){
        bolsa=mezclar(listaOriginal);
        // Evita repetir el último audio del ciclo anterior justo al inicio del nuevo
        if(bolsa.length>1 && bolsa[0].url===ultimoUrl){
            [bolsa[0],bolsa[1]]=[bolsa[1],bolsa[0]];
        }
    }
    const siguiente=bolsa.shift();
    ultimoUrl=siguiente.url;
    return siguiente;
}

let ultimoUrl=null;

//---------------------------------------------
function reproducir(item){

    audio.pause();
    audio.src=item.url;
    audio.load();

    audio.play()
    .then(()=>{
        player.className="playing";
        icono.textContent="⏸";
        nombre.textContent=item.nombre;
    })
    .catch(()=>{
        // Si un audio falla, intenta con el siguiente
        programarSiguiente(0);
    });

}

function programarSiguiente(minutos){
    player.className="esperando";
    icono.textContent="⏳";
    clearTimeout(temporizador);
    temporizador=setTimeout(()=>{
        if(!pausadoManual){
            const item=siguienteAudio();
            reproducir(item);
        }
    },minutos*60*1000);
}

audio.onended=()=>{
    if(!pausadoManual){
        programarSiguiente(minutosEspera);
    }
};

audio.onerror=()=>{
    mensaje.textContent="";
    programarSiguiente(0);
};

//---------------------------------------------
player.onclick=()=>{

    if(player.className==="esperando"){
        return; // mientras espera el próximo audio, no hace nada al tocar
    }

    if(audio.paused){
        audio.play();
        player.className="playing";
        icono.textContent="⏸";
        pausadoManual=false;
    }else{
        audio.pause();
        player.className="paused";
        icono.textContent="▶";
        pausadoManual=true;
    }

};

//---------------------------------------------
btnIniciar.onclick=async()=>{

    const minutosValor=parseInt(minutosInput.value,10);

    if(!minutosValor || minutosValor<1){
        mensaje.textContent="Escribe un número válido de minutos.";
        return;
    }

    minutosEspera=minutosValor;
    mensaje.textContent="Cargando lista de audios...";
    btnIniciar.disabled=true;

    try{
        listaOriginal=await cargarAudios();
    }catch(e){
        mensaje.textContent="Error al cargar los audios. Revisa tu conexión.";
        btnIniciar.disabled=false;
        return;
    }

    if(listaOriginal.length===0){
        mensaje.textContent="No se encontraron audios en la carpeta.";
        btnIniciar.disabled=false;
        return;
    }

    bolsa=[];
    pausadoManual=false;

    await mantenerPantalla();

    inicio.style.display="none";
    player.style.display="flex";

    const item=siguienteAudio();
    reproducir(item);

};

</script>

</body>
</html>
