<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rep Audios esp Minutos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
    --wait-glow: rgba(165, 153, 199, .35);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    user-select:none;
  }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:14px;
  }

  /* ---------- pantalla de configuración ---------- */
  #config{
    height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  #config h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 10px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #config p{
    font-size:.88rem; color:var(--fg-muted); max-width:320px; margin:0 0 26px;
  }
  #config .campo{
    width:100%; max-width:280px;
    display:flex; flex-direction:column;
    align-items:center;
    margin-bottom:18px;
  }
  #config .campo label{
    font-size:.85rem; color:var(--fg-muted); margin-bottom:8px;
  }
  #config input{
    width:100%; max-width:200px;
    font-size:1.4rem; text-align:center;
    padding:12px; margin-bottom:0;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
  }
  #config button{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; letter-spacing:.06em; font-size:1.05rem;
    width:100%; max-width:260px;
    padding:16px; margin-top:8px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none; border-radius:14px;
    cursor:pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  #config button:active{ transform: scale(.97); }
  #config button:disabled{ opacity:.4; cursor:default; }
  #configMsg{
    margin-top:14px; font-size:.85rem; color:var(--coral); min-height:18px;
  }

  /* ---------- pantalla de reproducción ---------- */
  #player{
    display:none;
    height:100dvh; width:100vw;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    transition: background-color .4s ease, box-shadow .4s ease;
    cursor:pointer;
  }
  #player.playing{ box-shadow: inset 0 0 140px var(--teal-glow); }
  #player.paused{ box-shadow: inset 0 0 140px var(--coral-glow); }
  #player.esperando{ box-shadow: inset 0 0 140px var(--wait-glow); }
  #player.terminado{ box-shadow: inset 0 0 140px var(--coral-glow); }

  #icono{
    font-size:100px;
    line-height:1;
    margin-bottom:10px;
  }
  #categoriaAudio{
    display:none;
    margin-top:14px; padding:5px 14px; border-radius:20px;
    font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    background: rgba(47,217,199,.15); color: var(--teal);
  }
  #categoriaAudio.visible{ display:block; }
  #nombreAudio{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.7rem; margin-top:15px;
    max-width:90%;
    word-break:break-word;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #estadoPlayer{
    font-size:1.05rem; margin-top:14px; color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }
  #contador{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:3.2rem; margin-top:12px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #contador.hidden{ display:none; }
  #siguiente{
    margin-top:26px;
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--teal);
    padding:12px 20px;
    border:1px solid var(--card-border); border-radius:12px;
    background: var(--card);
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  #siguiente:active{ border-color: var(--teal); }
  #info{
    position:absolute; bottom:max(74px, calc(env(safe-area-inset-bottom) + 40px));
    font-size:.8rem; color: var(--fg-muted); opacity:.7;
    text-align:center;
    left:0; right:0;
  }
</style>
</head>

<body>

<div id="config">
  <div class="eyebrow">Rep Audios esp Minutos</div>
  <h1>Configura la reproducción</h1>

  <div class="campo">
    <label for="minutos">Minutos entre cada audio</label>
    <input id="minutos" type="number" min="0.5" step="0.5" value="4" inputmode="decimal">
  </div>

  <div class="campo">
    <label for="proporcion">Audios de Avanzado por cada Experto</label>
    <input id="proporcion" type="number" min="1" step="1" value="2" inputmode="numeric">
  </div>

  <button id="btnIniciar">Iniciar</button>
  <div id="configMsg"></div>
</div>

<div id="player">
  <div id="icono">⏸</div>
  <div id="categoriaAudio"></div>
  <div id="nombreAudio"></div>
  <div id="estadoPlayer"></div>
  <div id="contador" class="hidden"></div>
  <button id="siguiente">⏭ Siguiente audio</button>
  <div id="info">
    Toca cualquier parte de la pantalla
    <br>
    para Pausar / Reanudar
  </div>
</div>

<audio id="audio"></audio>

<script>

//==============================
// CONFIGURA AQUÍ TU REPOSITORIO
//==============================
const USUARIO = "fredyhb999-dev";
const REPO    = "Juego-Actividades";
const CARPETA = "Audio c 4 Minutos";
const SUBCARPETA_0 = "Principiante"; // se reproduce completa una sola vez, al inicio
const SUBCARPETA_1 = "Avanzado"; // se reproduce primero en cada vuelta
const SUBCARPETA_2 = "Experto";  // se reproduce al final de cada vuelta
//==============================

const configEl=document.getElementById("config");
const minutosInput=document.getElementById("minutos");
const proporcionInput=document.getElementById("proporcion");
const btnIniciar=document.getElementById("btnIniciar");
const configMsg=document.getElementById("configMsg");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const icono=document.getElementById("icono");
const categoriaAudio=document.getElementById("categoriaAudio");
const nombre=document.getElementById("nombreAudio");
const estadoPlayer=document.getElementById("estadoPlayer");
const contador=document.getElementById("contador");
const btnSiguiente=document.getElementById("siguiente");

const CLAVE_CFG="audio_c4minutos_cfg";

let listaAvanzado=[];
let listaExperto=[];
let colaPrincipiante=[]; // se reproduce completa, en orden, una sola vez al inicio
let barajaAvanzado=[];
let barajaExperto=[];
let ultimoAvanzado=null;
let ultimoExperto=null;
let proporcion=2; // audios de Avanzado por cada 1 de Experto
let pasoCiclo=0;   // cuántos "Avanzado" van reproducidos desde el último "Experto"
let minutosEspera=4;
let wakeLock=null;
let pausadoManual=false;
let intervalo=null;
let tiempoRestante=0;
let itemActual=null;
let fallosConsecutivos=0;
let falloContado=false;
let detenido=false;

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){
    const n=nombreArchivo.toLowerCase();
    return extensionesAudio.some(ext=>n.endsWith(ext));
}

function nombreVisible(n){
    const p=n.lastIndexOf(".");
    return p>0 ? n.substring(0,p) : n;
}

// Los archivos de Principiante traen prefijo de secuencia (001 5 T.mp3).
// Se quita SOLO en esa carpeta para no romper nombres como "10 C" o "20 T".
function nombreMostrar(item){
    if(item.categoria==="Principiante"){
        return item.nombre.replace(/^\d+\s+/,"");
    }
    return item.nombre;
}

function seg_a_mmss(s){
    const m=Math.floor(s/60);
    const ss=s%60;
    return m+":"+String(ss).padStart(2,"0");
}

//---------------------------------------------
// La configuración se recuerda entre visitas
//---------------------------------------------
function cargarCfg(){
    try{
        const raw=localStorage.getItem(CLAVE_CFG);
        if(!raw) return;
        const c=JSON.parse(raw);
        if(c.minutos) minutosInput.value=c.minutos;
        if(c.proporcion) proporcionInput.value=c.proporcion;
    }catch(e){}
}

function guardarCfg(){
    try{
        localStorage.setItem(CLAVE_CFG,JSON.stringify({
            minutos:minutosInput.value,
            proporcion:proporcionInput.value
        }));
    }catch(e){}
}

//---------------------------------------------
async function mantenerPantalla(){
    try{
        if('wakeLock' in navigator){
            wakeLock=await navigator.wakeLock.request('screen');
            wakeLock.addEventListener("release",()=>{});
        }
    }catch(e){}
}

document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible" && wakeLock==null){
        await mantenerPantalla();
    }
});

//---------------------------------------------
async function listarAudiosDe(ruta){
    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(ruta);
    const res=await fetch(url);
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta: "+ruta);
    }
    const datos=await res.json();
    const lista=datos.filter(item=>item.type==="file" && esAudio(item.name));
    return lista.map(item=>({nombre:nombreVisible(item.name),url:item.download_url}));
}

async function cargarAudios(){
    const listaPrincipiante=await listarAudiosDe(CARPETA+"/"+SUBCARPETA_0);
    listaPrincipiante.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
    colaPrincipiante=listaPrincipiante;

    listaAvanzado=await listarAudiosDe(CARPETA+"/"+SUBCARPETA_1);
    listaExperto=await listarAudiosDe(CARPETA+"/"+SUBCARPETA_2);
}

//---------------------------------------------
function mezclar(arr){
    const copia=arr.slice();
    for(let i=copia.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copia[i],copia[j]]=[copia[j],copia[i]];
    }
    return copia;
}

function sacarDeBaraja(categoria){

    if(categoria==="avanzado"){
        if(barajaAvanzado.length===0){
            barajaAvanzado=mezclar(listaAvanzado);
            if(barajaAvanzado.length>1 && barajaAvanzado[0].url===ultimoAvanzado){
                [barajaAvanzado[0],barajaAvanzado[1]]=[barajaAvanzado[1],barajaAvanzado[0]];
            }
        }
        const item=barajaAvanzado.shift();
        ultimoAvanzado=item.url;
        return item;
    }else{
        if(barajaExperto.length===0){
            barajaExperto=mezclar(listaExperto);
            if(barajaExperto.length>1 && barajaExperto[0].url===ultimoExperto){
                [barajaExperto[0],barajaExperto[1]]=[barajaExperto[1],barajaExperto[0]];
            }
        }
        const item=barajaExperto.shift();
        ultimoExperto=item.url;
        return item;
    }

}

function siguienteAudio(){

    if(colaPrincipiante.length>0){
        const item=colaPrincipiante.shift();
        return Object.assign({},item,{categoria:"Principiante"});
    }

    const hayAvanzado=listaAvanzado.length>0;
    const hayExperto=listaExperto.length>0;

    let categoria;

    if(hayAvanzado && hayExperto){
        if(pasoCiclo<proporcion){
            categoria="avanzado";
            pasoCiclo++;
        }else{
            categoria="experto";
            pasoCiclo=0;
        }
    }else if(hayAvanzado){
        categoria="avanzado";
    }else{
        categoria="experto";
    }

    const item=sacarDeBaraja(categoria);
    return Object.assign({},item,{
        categoria: categoria==="avanzado" ? "Avanzado" : "Experto"
    });

}

//---------------------------------------------
function reproducir(item){

    if(detenido) return;

    itemActual=item;
    falloContado=false;
    clearInterval(intervalo);
    intervalo=null;

    audio.pause();
    audio.src=item.url;
    audio.load();

    audio.play()
    .then(()=>{
        fallosConsecutivos=0;
        player.className="playing";
        icono.textContent="⏸";
        categoriaAudio.textContent=item.categoria || "";
        categoriaAudio.className="visible";
        nombre.textContent=nombreMostrar(item);
        estadoPlayer.textContent="Reproduciendo";
        contador.className="hidden";
        contador.textContent="";
        btnSiguiente.style.display="";
    })
    .catch(()=>{
        falloDeAudio();
    });

}

function falloDeAudio(){

    // play() y onerror pueden avisar del mismo fallo: se cuenta una sola vez
    if(falloContado || detenido) return;
    falloContado=true;
    fallosConsecutivos++;

    if(fallosConsecutivos>=3){
        detener("No se pudieron reproducir 3 audios seguidos. Revisa tu conexión.");
        return;
    }

    programarSiguiente(0);
}

function avanzar(){
    if(detenido) return;
    const item=siguienteAudio();
    if(!item){
        detener("No quedan audios disponibles.");
        return;
    }
    reproducir(item);
}

function programarSiguiente(minutos){

    if(detenido) return;

    player.className="esperando";
    icono.textContent="⏳";
    btnSiguiente.style.display="";

    tiempoRestante=Math.max(0,Math.round(minutos*60));
    clearInterval(intervalo);
    intervalo=null;

    // Sin espera: pequeño retardo para que el error sea visible
    if(tiempoRestante<=0){
        estadoPlayer.textContent="Buscando el siguiente audio...";
        contador.className="hidden";
        intervalo=setInterval(()=>{
            clearInterval(intervalo);
            intervalo=null;
            avanzar();
        },1200);
        return;
    }

    contador.className="";
    contador.textContent=seg_a_mmss(tiempoRestante);
    estadoPlayer.textContent="Siguiente audio en";

    intervalo=setInterval(()=>{
        tiempoRestante--;
        if(tiempoRestante<=0){
            clearInterval(intervalo);
            intervalo=null;
            contador.className="hidden";
            avanzar();
        }else{
            contador.textContent=seg_a_mmss(tiempoRestante);
        }
    },1000);
}

function saltarAlSiguiente(){
    if(detenido) return;
    clearInterval(intervalo);
    intervalo=null;
    pausadoManual=false;
    avanzar();
}

function detener(mensaje){
    detenido=true;
    clearInterval(intervalo);
    intervalo=null;
    audio.pause();
    player.className="terminado";
    icono.textContent="⏹";
    contador.className="hidden";
    estadoPlayer.textContent=mensaje || "Toca para volver al menú.";
    btnSiguiente.style.display="none";
}

function reiniciarSesion(){
    detenido=false;
    fallosConsecutivos=0;
    clearInterval(intervalo);
    intervalo=null;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    icono.textContent="⏸";
    categoriaAudio.textContent="";
    categoriaAudio.className="";
    nombre.textContent="";
    estadoPlayer.textContent="";
    contador.className="hidden";
    btnSiguiente.style.display="none";
    configEl.style.display="flex";
}

audio.onended=()=>{
    if(!pausadoManual && !detenido){
        programarSiguiente(minutosEspera);
    }
};

audio.onerror=()=>{
    falloDeAudio();
};

//---------------------------------------------
player.onclick=()=>{

    if(detenido){
        reiniciarSesion();
        return;
    }

    if(player.className==="esperando"){
        return; // mientras espera el próximo audio, no hace nada al tocar
    }

    if(audio.paused){
        audio.play();
        player.className="playing";
        icono.textContent="⏸";
        estadoPlayer.textContent="Reproduciendo";
        pausadoManual=false;
    }else{
        audio.pause();
        player.className="paused";
        icono.textContent="▶";
        estadoPlayer.textContent="Pausado";
        pausadoManual=true;
    }

};

btnSiguiente.onclick=(e)=>{
    e.stopPropagation();
    saltarAlSiguiente();
};

//---------------------------------------------
btnIniciar.onclick=async()=>{

    const minutosValor=parseFloat(minutosInput.value);
    const proporcionValor=parseInt(proporcionInput.value,10);

    if(!minutosValor || minutosValor<=0){
        configMsg.textContent="Escribe un número válido de minutos (0.5 o más).";
        return;
    }

    if(!proporcionValor || proporcionValor<1){
        configMsg.textContent="Escribe un número válido de audios de Avanzado por Experto.";
        return;
    }

    minutosEspera=minutosValor;
    proporcion=proporcionValor;
    guardarCfg();
    configMsg.textContent="Cargando lista de audios...";
    btnIniciar.disabled=true;

    try{
        await cargarAudios();
    }catch(e){
        configMsg.textContent="Error al cargar los audios. Revisa tu conexión.";
        btnIniciar.disabled=false;
        return;
    }

    if(colaPrincipiante.length===0 && listaAvanzado.length===0 && listaExperto.length===0){
        configMsg.textContent="No se encontraron audios en ninguna de las carpetas.";
        btnIniciar.disabled=false;
        return;
    }

    barajaAvanzado=[];
    barajaExperto=[];
    pasoCiclo=0;
    pausadoManual=false;
    detenido=false;
    fallosConsecutivos=0;
    clearInterval(intervalo);
    intervalo=null;

    await mantenerPantalla();

    configEl.style.display="none";
    player.style.display="flex";
    player.className="";

    avanzar();

};

cargarCfg();

</script>

<script src="../js/volver.js" data-padre="../JuegosGuiados.html"></script>
</body>
</html>
