<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutinas de Alexa</title>

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --verde: #6dffa0;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body{
    padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }

  header{
    width:100%; max-width:900px;
    text-align:center;
    margin-bottom: 26px;
  }

  .volver{
    display:inline-flex; align-items:center; gap:6px;
    margin-bottom: 18px; padding: 8px 14px;
    background: transparent; color: var(--fg-muted);
    border: 1px solid var(--card-border); border-radius: 20px;
    font-family:'Inter', sans-serif; font-size: .8rem; cursor:pointer;
  }
  .volver:active{ transform: scale(.96); }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size: .78rem;
    letter-spacing: .35em;
    color: var(--fg-muted);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule{
    width: 64px; height: 3px; margin: 16px auto 0;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border-radius: 2px;
  }

  #panel{
    width:100%; max-width:900px;
    display:grid; grid-template-columns: 1fr 1.2fr; gap:18px; align-items:start;
  }

  .panel{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px;
  }

  .panel h2{
    font-family:'Chakra Petch', sans-serif;
    font-size: 1rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--fg-muted);
    margin: 0 0 14px;
  }

  #lista{ display:flex; flex-direction:column; gap:8px; }

  .item{
    width:100%; text-align:left; padding:12px 14px;
    background: var(--bg-2); color: var(--fg);
    border:1px solid var(--card-border); border-radius:12px;
    font-family:'Inter', sans-serif; font-size:.95rem; font-weight:500;
    cursor:pointer; transition: border-color .15s ease, transform .1s ease;
  }
  .item:active{ transform: scale(.98); }
  .item.activo{ border-color: var(--teal); background: rgba(47,217,199,.12); }

  #detalle{ display:none; }

  .detAccion{
    font-family:'Chakra Petch', sans-serif; font-weight:700;
    font-size:1.25rem; margin:0 0 10px;
  }

  .badge{
    display:inline-block; padding:5px 12px; border-radius:20px; margin-bottom:14px;
    font-size:.75rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    background: rgba(47,217,199,.15); color: var(--teal);
  }

  .k{
    font-size:.78rem; color:var(--fg-muted);
    text-transform:uppercase; letter-spacing:.08em; margin:12px 0 6px;
  }

  .v{ font-size:.95rem; line-height:1.45; color: var(--fg); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }

  .chip{
    padding:6px 12px; border-radius:20px; font-size:.8rem;
    background: var(--bg-2); border:1px solid var(--card-border); color:var(--fg);
  }

  #btnIr{
    margin-top:20px; width:100%; padding:16px; border:none; border-radius:14px;
    font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:1rem; cursor:pointer;
    color: var(--bg); background: linear-gradient(90deg, var(--coral), var(--teal));
    transition: opacity .15s ease, transform .1s ease;
  }
  #btnIr:active{ transform: scale(.98); }
  #btnIr:disabled{ opacity:.45; cursor:default; }

  .estado{
    display:none; margin-top:14px; padding:12px 14px; border-radius:12px;
    font-size:.85rem; line-height:1.45;
    background: var(--bg-2); border:1px solid var(--card-border); color: var(--fg);
  }
  .estado.visible{ display:block; }
  .estado.busy{ border-color: var(--teal); background: rgba(47,217,199,.1); color: var(--teal); }
  .estado.ok{ border-color: var(--verde); background: rgba(109,255,160,.1); color: var(--verde); }
  .estado.err{ border-color: var(--coral); background: rgba(255,106,92,.1); color: var(--coral); }

  @media (max-width: 680px){
    #panel{ grid-template-columns: 1fr; }
  }

  /* ---------- MODAL BIENVENIDA ---------- */
  #modalBienvenida{
    position:fixed; inset:0; z-index:10000;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay-b{
    position:absolute; inset:0;
    background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
  }
  .modal-content-b{
    position:relative; background:var(--card);
    border:1px solid var(--card-border); border-radius:16px;
    width:100%; max-width:420px;
    padding:24px 20px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6); z-index:10001;
  }
  .modal-content-b h2{
    margin:0 0 12px; font-family:'Chakra Petch', sans-serif; font-size:1.3rem;
  }
  .modal-content-b p{
    margin:0 0 22px; font-size:.95rem; color:var(--fg-muted); line-height:1.5;
  }
  .btn-aceptar-bienvenida{
    width:100%; padding:16px; border:none; border-radius:14px;
    font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:1.1rem;
    color: var(--bg); background: linear-gradient(90deg, var(--coral), var(--teal));
    cursor:pointer; transition: transform .15s ease, opacity .2s ease;
  }
  .btn-aceptar-bienvenida:active{ transform: scale(.96); }
</style>
</head>

<body>

<header>
  <button class="volver" onclick="location.href='index.html'">‹ Volver al menú</button>
  <p class="eyebrow">Smart Home</p>
  <h1>Rutinas de Alexa</h1>
  <div class="rule"></div>
</header>

<div id="panel">
  <div class="panel">
    <h2>Acciones</h2>
    <div id="lista"></div>
  </div>
  <div class="panel">
    <h2>Detalle</h2>
    <div id="detalle"></div>
  </div>
</div>

<!-- Modal Bienvenida -->
<div id="modalBienvenida">
  <div class="modal-overlay-b" onclick="cerrarBienvenida()"></div>
  <div class="modal-content-b" onclick="event.stopPropagation()">
    <h2>Bienvenido a Rutinas de Alexa</h2>
    <button class="btn-aceptar-bienvenida" onclick="activarBienvenida()">Aceptar</button>
  </div>
</div>

<script>
const listaEl = document.getElementById("lista");
const detalleEl = document.getElementById("detalle");

let acciones = [];
let seleccionada = null;
let wakeLock = null;

// ---------- Wake Lock ----------
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){
    console.warn("No se pudo activar Wake Lock:", e);
  }
}
function releaseWakeLock(){
  if(wakeLock){
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible"){
    await requestWakeLock();
  }
});

async function cargar(){
  try{
    const r = await fetch("acciones.json");
    if(!r.ok) throw new Error("HTTP " + r.status);
    acciones = await r.json();
  }catch(e){
    listaEl.innerHTML = '<div class="v">No se pudo cargar acciones.json. Revisa el archivo.</div>';
    console.error(e);
    return;
  }
  renderLista();
}

function renderLista(){
  listaEl.innerHTML = "";
  acciones.forEach((a, i)=>{
    const item = document.createElement("button");
    item.className = "item" + (i === seleccionada ? " activo" : "");
    item.textContent = a.accion;
    item.onclick = ()=> seleccionar(i);
    listaEl.appendChild(item);
  });
}

function seleccionar(i){
  seleccionada = i;
  renderLista();
  const a = acciones[i];
  detalleEl.innerHTML = "";

  const nm = document.createElement("div");
  nm.className = "detAccion";
  nm.textContent = a.accion || "";
  detalleEl.appendChild(nm);

  if(a.naturaleza){
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = a.naturaleza;
    detalleEl.appendChild(badge);
  }

  if(a.descripcion){
    const k = document.createElement("div");
    k.className = "k";
    k.textContent = "Descripción";
    const v = document.createElement("div");
    v.className = "v";
    v.textContent = a.descripcion;
    detalleEl.appendChild(k);
    detalleEl.appendChild(v);
  }

  if(a.skillAlexa){
    const k = document.createElement("div");
    k.className = "k";
    k.textContent = "Skill de Alexa";
    const v = document.createElement("div");
    v.className = "v";
    v.textContent = a.skillAlexa;
    detalleEl.appendChild(k);
    detalleEl.appendChild(v);
  }

  const mats = (a.materiales || []).filter(m=> m && String(m).trim() !== "");
  if(mats.length){
    const k = document.createElement("div");
    k.className = "k";
    k.textContent = "Materiales necesarios";
    const chips = document.createElement("div");
    chips.className = "chips";
    mats.forEach(m=>{
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = m;
      chips.appendChild(chip);
    });
    detalleEl.appendChild(k);
    detalleEl.appendChild(chips);
  }

  const btn = document.createElement("button");
  btn.id = "btnIr";
  btn.disabled = !a.link || a.link === "#";
  btn.textContent = (a.link && a.link !== "#") ? "Enviar rutina" : "Sin enlace asignado";
  detalleEl.appendChild(btn);

  const estado = document.createElement("div");
  estado.className = "estado";
  estado.id = "estado";
  detalleEl.appendChild(estado);

  btn.onclick = ()=> enviar(a, btn, estado);

  detalleEl.style.display = "block";
  if(window.innerWidth <= 680){
    detalleEl.scrollIntoView({ behavior:"smooth", block:"start" });
  }
}

async function enviar(a, btn, estado){
  const previo = btn.textContent;
  btn.disabled = true;
  estado.className = "estado visible busy";
  estado.textContent = "Enviando rutina a Alexa...";
  await requestWakeLock();

  try{
    await fetch(a.link, { mode:"no-cors", cache:"no-store" });
    estado.className = "estado visible ok";
    estado.textContent = "Rutina enviada. La app no puede leer la respuesta (el servidor no permite CORS), pero la peticion si se ejecuto. Puedes volver a enviarla cuando quieras.";
    btn.textContent = "Enviar de nuevo";
    btn.disabled = false;
  }catch(e){
    estado.className = "estado visible err";
    estado.textContent = "No se pudo enviar: " + e.message;
    btn.textContent = previo;
    btn.disabled = false;
  }
}

function activarBienvenida(){
  requestWakeLock();
  document.getElementById("modalBienvenida").style.display = "none";
}
function cerrarBienvenida(){
  document.getElementById("modalBienvenida").style.display = "none";
}

cargar();
</script>

</body>
</html>
