<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reproductor Aleatorio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    user-select: none;
  }

  #inicio, #estado{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    text-align:center;
    padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
  }

  #estado{ display:none; }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size: .78rem;
    letter-spacing: .35em;
    color: var(--fg-muted);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: .02em;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule{
    width: 64px; height: 3px; margin: 6px auto 26px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border-radius: 2px;
  }

  p.desc{
    font-size: .92rem;
    color: var(--fg-muted);
    max-width: 320px;
    margin: 0 0 34px;
    line-height: 1.5;
  }

  #btnInicio{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: .08em;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border: none;
    border-radius: 14px;
    padding: 18px 46px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
    box-shadow: 0 10px 30px -10px var(--coral-glow);
  }
  #btnInicio:active{ transform: scale(.96); }
  #btnInicio:disabled{ opacity:.5; cursor:default; }

  #msgInicio{
    margin-top: 22px;
    font-size: .88rem;
    color: var(--coral);
    min-height: 20px;
    max-width: 300px;
  }

  /* --- pantalla de reproducción --- */
  .pulso-wrap{
    width:120px; height:120px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle, var(--card) 55%, transparent 100%);
    margin-bottom: 28px;
    position: relative;
  }
  .pulso-wrap::before, .pulso-wrap::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    border: 2px solid var(--teal);
    opacity: 0;
    animation: pulso 2.4s ease-out infinite;
  }
  .pulso-wrap::after{ animation-delay: 1.2s; }
  @keyframes pulso{
    0%{ transform:scale(.7); opacity:.7; }
    100%{ transform:scale(1.6); opacity:0; }
  }
  .icono-audio{ font-size: 2.4rem; z-index:1; }

  #estado .title{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size: 1.3rem;
    letter-spacing:.03em;
  }
  #estado .subtitle{
    margin-top:8px;
    font-size:.85rem;
    color: var(--fg-muted);
  }
</style>
</head>
<body>

<div id="inicio">
  <p class="eyebrow">Sonido &middot; Frases</p>
  <h1>Reproductor Aleatorio</h1>
  <div class="rule"></div>
  <p class="desc">Reproduce frases al azar de la carpeta, con pausas variables entre cada una.</p>
  <button id="btnInicio">INICIAR</button>
  <div id="msgInicio"></div>
</div>

<div id="estado">
  <div class="pulso-wrap"><span class="icono-audio">🔊</span></div>
  <div class="title">Reproduciendo...</div>
  <div class="subtitle">Frases aleatorias en curso</div>
</div>

<audio id="player"></audio>

<script>
//==============================
// CONFIGURA AQUÍ TU REPOSITORIO
//==============================
const USUARIO = "fredyhb999-dev";
const REPO    = "Juego-Actividades";
const CARPETA = "Sonido-Frases";
//==============================

const player = document.getElementById("player");
const btnInicio = document.getElementById("btnInicio");
const msgInicio = document.getElementById("msgInicio");

let audios = [];
let ultimoAudio = -1;
let wakeLock = null;

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){
    const n=nombreArchivo.toLowerCase();
    return extensionesAudio.some(ext=>n.endsWith(ext));
}

//---------------------------------------------
async function cargarAudios(){
    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(CARPETA);
    const res=await fetch(url);
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta");
    }
    const datos=await res.json();
    const lista=datos.filter(item=>item.type==="file" && esAudio(item.name));
    return lista.map(item=>item.download_url);
}
//---------------------------------------------
async function pantallaCompleta(){
    try{
        if(document.documentElement.requestFullscreen){
            document.documentElement.requestFullscreen();
        }
    }catch(e){}
}
//---------------------------------------------
async function mantenerPantallaActiva(){
    if(!("wakeLock" in navigator))
        return;
    try{
        wakeLock = await navigator.wakeLock.request("screen");
    }catch(e){}
}
//---------------------------------------------
document.addEventListener("visibilitychange", async ()=>{
    if(!document.hidden){
        mantenerPantallaActiva();
    }
});
//---------------------------------------------
function obtenerAudioAleatorio(){
    if(audios.length===1){
        ultimoAudio=0;
        return 0;
    }
    let indice;
    do{
        indice=Math.floor(Math.random()*audios.length);
    }while(indice===ultimoAudio);
    ultimoAudio=indice;
    return indice;
}
//---------------------------------------------
function reproducir(src){
    return new Promise(resolve=>{
        player.src = src;
        player.onended = resolve;
        player.onerror = resolve;
        player.play().catch(resolve);
    });
}
//---------------------------------------------
function esperar(minutos){
    return new Promise(resolve=>{
        setTimeout(resolve,minutos*60*1000);
    });
}
//---------------------------------------------
async function iniciar(){
    while(true){
        const indice = obtenerAudioAleatorio();
        await reproducir(audios[indice]);
        const pausa = Math.floor(Math.random()*6)+5;
        await esperar(pausa);
    }
}
//---------------------------------------------
btnInicio.addEventListener("click", async ()=>{

    btnInicio.disabled=true;
    msgInicio.textContent="Cargando lista de audios...";

    try{
        audios = await cargarAudios();
    }catch(e){
        msgInicio.textContent="Error al cargar los audios. Revisa tu conexión.";
        btnInicio.disabled=false;
        return;
    }

    if(audios.length===0){
        msgInicio.textContent="No se encontraron audios en la carpeta.";
        btnInicio.disabled=false;
        return;
    }

    document.getElementById("inicio").style.display="none";
    document.getElementById("estado").style.display="flex";

    // Se solicitan, pero no se espera a que terminen.
    pantallaCompleta();
    mantenerPantallaActiva();

    // Se inicia inmediatamente la reproducción.
    iniciar();
});
</script>
</body>
</html>
