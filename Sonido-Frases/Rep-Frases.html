<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reproductor de Audio</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#f2f2f2;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#inicio,
#player{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

#player{
    display:none;
    cursor:pointer;
    user-select:none;
    transition:.25s;
}

#player.playing{
    background:#1d3557;
    color:white;
}

#player.paused{
    background:#555;
    color:white;
}

input{
    width:100%;
    max-width:400px;
    font-size:22px;
    padding:14px;
    margin-top:20px;
    margin-bottom:20px;
    text-align:center;
}

button{
    font-size:22px;
    padding:14px 30px;
}

#icono{
    font-size:120px;
}

#nombreAudio{
    margin-top:25px;
    font-size:24px;
    text-align:center;
    word-break:break-word;
}

#mensaje{
    margin-top:20px;
    color:red;
    text-align:center;
    min-height:28px;
}

#info{
    margin-top:35px;
    font-size:18px;
    opacity:.8;
    text-align:center;
}

</style>
</head>

<body>

<div id="inicio">

<h2>Nombre del audio</h2>

<input
id="archivo"
type="text"
autocomplete="off"
placeholder="Ejemplo: bienvenida">

<button id="reproducir">
Reproducir
</button>

<div id="mensaje"></div>

</div>

<div id="player">

<div id="icono">⏸</div>

<div id="nombreAudio"></div>

<div id="info">
Toca cualquier parte de la pantalla
<br>
para Pausar / Reanudar
</div>

</div>

<audio id="audio"></audio>

<script>

const input=document.getElementById("archivo");
const boton=document.getElementById("reproducir");
const mensaje=document.getElementById("mensaje");
const inicio=document.getElementById("inicio");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const icono=document.getElementById("icono");
const nombre=document.getElementById("nombreAudio");

let wakeLock=null;

async function mantenerPantalla(){

    try{

        if('wakeLock' in navigator){

            wakeLock=await navigator.wakeLock.request('screen');

            wakeLock.addEventListener("release",()=>{});

        }

    }catch(e){}

}

document.addEventListener("visibilitychange",async()=>{

    if(document.visibilityState==="visible" && wakeLock==null){

        await mantenerPantalla();

    }

});

function obtenerRuta(){

    let archivo=input.value.trim();

    if(archivo==="") return null;

    if(!archivo.includes(".")){

        archivo+=".mp3";

    }

    return archivo;

}

function nombreVisible(ruta){

    let n=ruta.split("/").pop();

    let p=n.lastIndexOf(".");

    if(p>0){

        n=n.substring(0,p);

    }

    return n;

}

boton.onclick=async()=>{

    mensaje.textContent="";

    let ruta=obtenerRuta();

    if(!ruta){

        mensaje.textContent="Escribe un nombre de archivo.";

        input.focus();

        return;

    }

    await mantenerPantalla();

    audio.pause();

    audio.src=ruta;

    audio.load();

    audio.play()
    .then(()=>{

        inicio.style.display="none";

        player.style.display="flex";

        player.className="playing";

        icono.textContent="⏸";

        nombre.textContent=nombreVisible(ruta);

    })
    .catch(()=>{

        mensaje.textContent="No se encontró: "+ruta;

    });

};

player.onclick=()=>{

    if(audio.paused){

        audio.play();

        player.className="playing";

        icono.textContent="⏸";

    }else{

        audio.pause();

        player.className="paused";

        icono.textContent="▶";

    }

};

audio.onended=()=>{

    inicio.style.display="flex";

    player.style.display="none";

    input.focus();
    input.select();

};

audio.onerror=()=>{

    inicio.style.display="flex";

    player.style.display="none";

    mensaje.textContent="No se encontró el archivo.";

    input.focus();
    input.select();

};

</script>

</body>
</html>
