<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Reproductor de Audio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html,body{
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
        radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
        var(--bg);
    color: var(--fg);
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#inicio,
#player{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding: max(30px, env(safe-area-inset-top)) 24px max(30px, env(safe-area-inset-bottom));
}

#inicio{
    display:none;
}

#inicio.visible{
    display:flex;
}

#player{
    display:none;
    cursor:pointer;
    user-select:none;
    transition: box-shadow .3s ease;
}

#player.playing{
    box-shadow: inset 0 0 160px var(--teal-glow);
}

#player.paused{
    box-shadow: inset 0 0 160px var(--coral-glow);
}

.eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size: .78rem;
    letter-spacing: .35em;
    color: var(--fg-muted);
    text-transform: uppercase;
    margin-bottom: 10px;
}

h2{
    font-family:'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing:.02em;
    margin-bottom:24px;
    text-align:center;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

#lista{
    width:100%;
    max-width:480px;
    max-height:56vh;
    overflow-y:auto;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius:16px;
}

.item{
    padding:17px 20px;
    font-size:1.02rem;
    font-weight:500;
    border-bottom:1px solid var(--card-border);
    cursor:pointer;
    word-break:break-word;
    position:relative;
    padding-left:26px;
    transition: background .15s ease;
}

.item::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background: var(--teal);
}

.item:nth-child(odd)::before{
    background: var(--coral);
}

.item:last-child{
    border-bottom:none;
}

.item:hover,
.item:active{
    background: rgba(255,255,255,.04);
}

button#recargar{
    margin-top:24px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    letter-spacing:.05em;
    font-size:.95rem;
    padding:13px 28px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition: transform .15s ease;
}

button#recargar:active{
    transform: scale(.96);
}

#icono{
    font-size:5.5rem;
}

#nombreAudio{
    margin-top:26px;
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    font-size:1.3rem;
    text-align:center;
    word-break:break-word;
}

#mensaje{
    margin-top:20px;
    color: var(--coral);
    text-align:center;
    min-height:24px;
    font-size:.9rem;
}

#info{
    margin-top:36px;
    font-size:.85rem;
    color: var(--fg-muted);
    text-align:center;
}

</style>
</head>

<body>

<div id="inicio">

<p class="eyebrow">Frases Acción</p>
<h2>Selecciona un audio</h2>

<div id="lista"></div>

<div id="mensaje"></div>

<button id="recargar">Actualizar lista</button>

</div>

<div id="player">

<div id="icono">⏸</div>

<div id="nombreAudio"></div>

<div id="info">
Toca cualquier parte de la pantalla
<br>
para Pausar / Reanudar
</div>

</div>

<audio id="audio"></audio>

<script>

// ======= CONFIGURA AQUÍ TU REPOSITORIO =======
const USUARIO   = "fredyhb999-dev";
const REPO      = "Juego-Actividades";
const CARPETA   = "Frases Accion";
// ==============================================

const inicio=document.getElementById("inicio");
const lista=document.getElementById("lista");
const mensaje=document.getElementById("mensaje");
const recargar=document.getElementById("recargar");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const icono=document.getElementById("icono");
const nombre=document.getElementById("nombreAudio");

let wakeLock=null;

async function mantenerPantalla(){

    try{

        if('wakeLock' in navigator){

            wakeLock=await navigator.wakeLock.request('screen');

            wakeLock.addEventListener("release",()=>{});

        }

    }catch(e){}

}

document.addEventListener("visibilitychange",async()=>{

    if(document.visibilityState==="visible" && wakeLock==null){

        await mantenerPantalla();

    }

});

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){

    const n=nombreArchivo.toLowerCase();

    return extensionesAudio.some(ext=>n.endsWith(ext));

}

function nombreVisible(n){

    const p=n.lastIndexOf(".");

    return p>0 ? n.substring(0,p) : n;

}

async function cargarLista(){

    lista.innerHTML="";
    mensaje.textContent="Cargando lista...";

    try{

        const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(CARPETA);

        const res=await fetch(url);

        if(!res.ok){

            throw new Error("No se pudo leer la carpeta");

        }

        const datos=await res.json();

        const audios=datos.filter(item=>item.type==="file" && esAudio(item.name));

        if(audios.length===0){

            mensaje.textContent="No hay archivos de audio en la carpeta.";

            return;

        }

        mensaje.textContent="";

        audios.sort((a,b)=>a.name.localeCompare(b.name,"es"));

        audios.forEach(item=>{

            const div=document.createElement("div");

            div.className="item";
            div.textContent=nombreVisible(item.name);

            div.onclick=()=>reproducir(item.download_url,nombreVisible(item.name));

            lista.appendChild(div);

        });

    }catch(e){

        mensaje.textContent="Error al cargar la lista. Revisa tu conexión.";

    }

}

async function reproducir(url,nombreMostrar){

    mensaje.textContent="";

    await mantenerPantalla();

    audio.pause();

    audio.src=url;

    audio.load();

    audio.play()
    .then(()=>{

        inicio.classList.remove("visible");

        player.style.display="flex";

        player.className="playing";

        icono.textContent="⏸";

        nombre.textContent=nombreMostrar;

    })
    .catch(()=>{

        mensaje.textContent="No se pudo reproducir el audio.";

    });

}

player.onclick=()=>{

    if(audio.paused){

        audio.play();

        player.className="playing";

        icono.textContent="⏸";

    }else{

        audio.pause();

        player.className="paused";

        icono.textContent="▶";

    }

};

function volverAlInicio(){

    inicio.classList.add("visible");

    player.style.display="none";

    cargarLista();

}

audio.onended=volverAlInicio;

audio.onerror=()=>{

    inicio.classList.add("visible");

    player.style.display="none";

    mensaje.textContent="No se encontró el archivo.";

    cargarLista();

};

recargar.onclick=cargarLista;

cargarLista();
inicio.classList.add("visible");

</script>

</body>
</html>
