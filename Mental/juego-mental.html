<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Juego Mental</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    user-select:none;
  }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:14px;
  }

  /* ---------- pantalla de configuración ---------- */
  #config{
    height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  #config h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 10px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #config p{
    font-size:.88rem; color:var(--fg-muted); max-width:320px; margin:0 0 26px;
  }
  #config input{
    width:100%; max-width:200px;
    font-size:1.4rem; text-align:center;
    padding:12px; margin-bottom:22px;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
  }
  #config button{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; letter-spacing:.06em; font-size:1.05rem;
    width:100%; max-width:260px;
    padding:16px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none; border-radius:14px;
    cursor:pointer;
    transition: transform .15s ease;
  }
  #config button:active{ transform: scale(.97); }
  #configMsg{
    margin-top:14px; font-size:.85rem; color:var(--coral); min-height:18px;
  }

  /* ---------- pantalla de reproducción ---------- */
  #screen{
    height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    transition: background-color .4s ease, box-shadow .4s ease;
    cursor:pointer;
  }
  #screen.playing{ box-shadow: inset 0 0 140px var(--teal-glow); }
  #screen.paused{ box-shadow: inset 0 0 140px var(--coral-glow); }
  #screen.error{ box-shadow: inset 0 0 140px var(--coral-glow); background: radial-gradient(circle at 50% 0%, #351421, var(--bg)); }

  #fase{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:2rem; margin-bottom:8px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #estado{ font-size:1.1rem; margin-bottom:28px; min-height:1.6em; color: var(--fg-muted); }
  #contador{ font-family:'Chakra Petch', sans-serif; font-size:3.6rem; font-weight:700; letter-spacing:1px; font-variant-numeric: tabular-nums; }
  #detalle{ font-size:1rem; opacity:.7; margin-top:10px; }
  #progreso{ margin-top:28px; font-size:.85rem; letter-spacing:.05em; color: var(--fg-muted); }
  #barra-wrap{ width:80%; max-width:420px; height:6px; background:var(--card-border); border-radius:4px; margin-top:14px; overflow:hidden; }
  #barra{ height:100%; width:0%; background: linear-gradient(90deg, var(--coral), var(--teal)); transition:width .3s ease; }
  #hint{ position:absolute; bottom:max(26px, env(safe-area-inset-bottom)); font-size:.8rem; color: var(--fg-muted); opacity:.7; }
</style>
</head>
<body>

<div id="config">
  <div class="eyebrow">Mental</div>
  <h1>Antes de comenzar</h1>
  <p>¿Cuántos segundos deben pasar entre cada frase?</p>
  <input id="tiempoFrase" type="number" min="1" step="1" value="30" inputmode="numeric">
  <button id="btnConfigIniciar">Iniciar</button>
  <div id="configMsg"></div>
</div>

<div id="screen" style="display:none;">
  <div class="eyebrow">Mental</div>
  <div id="fase"></div>
  <div id="estado"></div>
  <div id="contador"></div>
  <div id="detalle"></div>
  <div id="barra-wrap"><div id="barra"></div></div>
  <div id="progreso"></div>
  <div id="hint">Toca en cualquier momento para pausar / continuar</div>
</div>

<audio id="audioEl" playsinline></audio>

<script>
(function(){
  "use strict";

  // ====== CONFIGURACIÓN ======
  const OWNER = "fredyhb999-dev";
  const REPO = "Juego-Actividades";
  const BRANCH = "main";
  const BASE_FOLDER = "Mental";
  const FOLDERS = ["Fase 1a","Fase 1b","Fase 2a","Fase 2b","Fase 3a","Fase 3b","Fase 4a","Fase 4b","Especial"];
  const FRASES_POR_CARPETA = 7;
  let ESPERA_FRASE_MS = 0.5 * 60 * 1000; // valor por defecto; se sobrescribe con lo que el usuario indique al inicio
  const ESPERA_CARPETA_MS = 1 * 60 * 1000; // 1 minuto al cambiar de carpeta
  // ============================

  const configEl        = document.getElementById("config");
  const tiempoFraseInput = document.getElementById("tiempoFrase");
  const btnConfigIniciar = document.getElementById("btnConfigIniciar");
  const configMsgEl      = document.getElementById("configMsg");

  const screenEl   = document.getElementById("screen");
  const faseEl     = document.getElementById("fase");
  const estadoEl   = document.getElementById("estado");
  const contadorEl = document.getElementById("contador");
  const detalleEl  = document.getElementById("detalle");
  const progresoEl = document.getElementById("progreso");
  const barraEl    = document.getElementById("barra");
  const hintEl     = document.getElementById("hint");
  const audioEl    = document.getElementById("audioEl");

  const state = {
    running: false,
    paused: false,
    stopRequested: false,
    playingAudio: false,   // true si el estado actual es "reproduciendo audio"
    finished: false
  };

  let wakeLock = null;

  // ---------- Wake Lock ----------
  async function requestWakeLock(){
    try{
      if("wakeLock" in navigator){
        wakeLock = await navigator.wakeLock.request("screen");
      }
    }catch(e){
      console.warn("No se pudo activar Wake Lock:", e);
    }
  }
  function releaseWakeLock(){
    if(wakeLock){
      wakeLock.release().catch(()=>{});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState === "visible" && state.running && !state.paused){
      await requestWakeLock();
    }
  });

  // ---------- Utilidades ----------
  function pickRandom(arr, n){
    const copy = arr.slice();
    const result = [];
    const total = Math.min(n, copy.length);
    for(let i=0;i<total;i++){
      const idx = Math.floor(Math.random()*copy.length);
      result.push(copy.splice(idx,1)[0]);
    }
    return result;
  }

  function fmtTime(ms){
    const totalSec = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(totalSec/60);
    const s = totalSec % 60;
    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }

  async function listMp3(folderName){
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(BASE_FOLDER)}/${encodeURIComponent(folderName)}?ref=${BRANCH}`;
    const res = await fetch(url, { headers: { "Accept": "application/vnd.github.v3+json" } });
    if(res.status === 404){
      // En git las carpetas vacías no existen como tal, así que GitHub
      // responde 404 cuando no hay ningún archivo dentro. Lo tratamos
      // como "carpeta vacía" en vez de un error real.
      return [];
    }
    if(!res.ok){
      throw new Error(`No se pudo leer la carpeta "${folderName}" (HTTP ${res.status})`);
    }
    const data = await res.json();
    if(!Array.isArray(data)){
      // Puede pasar si la "carpeta" en realidad es un solo archivo u otro caso raro
      return [];
    }
    return data
      .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".mp3"))
      .map(f => ({ name: f.name, rawUrl: f.download_url }));
  }

  // ---------- UI ----------
  function setScreenClass(cls){
    screenEl.classList.remove("playing","paused","error");
    if(cls) screenEl.classList.add(cls);
  }

  function updateProgreso(folderIdx, phraseIdx, phraseTotal, totalFolders){
    progresoEl.textContent = `Carpeta ${folderIdx+1} / ${totalFolders}`;
    const pct = ((folderIdx + (phraseIdx/phraseTotal)) / totalFolders) * 100;
    barraEl.style.width = Math.min(100, Math.max(0,pct)) + "%";
  }

  // ---------- Espera cancelable / pausable ----------
  function wait(ms){
    return new Promise((resolve)=>{
      let remaining = ms;
      state.playingAudio = false;
      const tick = ()=>{
        if(state.stopRequested){ resolve(); return; }
        if(!state.paused){
          remaining -= 200;
          contadorEl.textContent = fmtTime(remaining);
        }
        if(remaining <= 0){ resolve(); return; }
        state._waitTimer = setTimeout(tick, 200);
      };
      tick();
    });
  }

  // ---------- Reproducción de audio pausable ----------
  function playAudioFile(url){
    return new Promise((resolve, reject)=>{
      state.playingAudio = true;
      audioEl.src = url;
      audioEl.currentTime = 0;

      const onEnded = ()=>{ cleanup(); resolve(); };
      const onError = ()=>{ cleanup(); reject(new Error("Error al reproducir el audio")); };
      function cleanup(){
        audioEl.removeEventListener("ended", onEnded);
        audioEl.removeEventListener("error", onError);
      }
      audioEl.addEventListener("ended", onEnded);
      audioEl.addEventListener("error", onError);

      if(state.stopRequested){ cleanup(); resolve(); return; }

      if(!state.paused){
        audioEl.play().catch((e)=>{ cleanup(); reject(e); });
      }
      // si está pausado justo al llegar aquí, togglePause() se encargará de darle play
    });
  }

  // ---------- Secuencia principal ----------
  async function runGame(){
    // 1) Construir el plan completo primero: consultamos todas las carpetas,
    //    saltando silenciosamente las que estén vacías, para poder saber
    //    con certeza cuál es la última frase real de todo el juego.
    estadoEl.textContent = "Preparando carpetas...";
    const plan = [];
    for(let fi=0; fi<FOLDERS.length; fi++){
      if(state.stopRequested) return;
      const folderName = FOLDERS[fi];
      let files;
      try{
        files = await listMp3(folderName);
      }catch(e){
        showError(`Error leyendo "${folderName}": ${e.message}`);
        return;
      }
      if(files.length === 0){
        continue; // carpeta vacía: se omite y no cuenta para el progreso
      }
      const seleccion = pickRandom(files, FRASES_POR_CARPETA);
      plan.push({ folderName, seleccion });
    }

    if(plan.length === 0){
      showError("Ninguna de las carpetas tiene archivos .mp3");
      return;
    }

    // 2) Reproducir el plan
    for(let fi=0; fi<plan.length; fi++){
      if(state.stopRequested) break;
      const { folderName, seleccion } = plan[fi];

      faseEl.textContent = folderName;
      updateProgreso(fi, 0, seleccion.length, plan.length);

      for(let pi=0; pi<seleccion.length; pi++){
        if(state.stopRequested) break;
        const item = seleccion[pi];

        estadoEl.textContent = `Reproduciendo frase ${pi+1} de ${seleccion.length}`;
        detalleEl.textContent = item.name;
        contadorEl.textContent = "";
        updateProgreso(fi, pi, seleccion.length, plan.length);

        try{
          await playAudioFile(item.rawUrl);
        }catch(e){
          showError(`No se pudo reproducir "${item.name}"`);
          return;
        }

        if(state.stopRequested) break;

        const esUltimaFraseGlobal = (fi === plan.length-1) && (pi === seleccion.length-1);
        const esUltimaFraseDeCarpeta = (pi === seleccion.length-1);

        if(!esUltimaFraseGlobal){
          if(esUltimaFraseDeCarpeta){
            estadoEl.textContent = "Cambiando de carpeta en...";
            await wait(ESPERA_CARPETA_MS);
          }else{
            estadoEl.textContent = "Siguiente frase en...";
            await wait(ESPERA_FRASE_MS);
          }
        }
      }
    }

    if(!state.stopRequested){
      finishGame();
    }
  }

  function showError(msg){
    setScreenClass("error");
    faseEl.textContent = "Error";
    estadoEl.textContent = msg;
    contadorEl.textContent = "";
    detalleEl.textContent = "Toca para reiniciar";
    hintEl.textContent = "";
    state.running = false;
    state.paused = false;
    state.finished = true;
    releaseWakeLock();
  }

  function finishGame(){
    setScreenClass("");
    faseEl.textContent = "Juego terminado";
    estadoEl.textContent = "Todas las carpetas fueron reproducidas";
    contadorEl.textContent = "✓";
    detalleEl.textContent = "";
    progresoEl.textContent = "";
    barraEl.style.width = "100%";
    hintEl.textContent = "Toca para volver a empezar";
    state.running = false;
    state.paused = false;
    state.finished = true;
    releaseWakeLock();
  }

  // ---------- Control de inicio / pausa ----------
  async function startGame(){
    state.running = true;
    state.paused = false;
    state.stopRequested = false;
    state.finished = false;
    setScreenClass("playing");
    hintEl.textContent = "Toca en cualquier momento para pausar / continuar";
    await requestWakeLock();
    runGame();
  }

  function togglePause(){
    state.paused = !state.paused;
    if(state.paused){
      setScreenClass("paused");
      estadoEl.dataset.prev = estadoEl.textContent;
      if(state.playingAudio && !audioEl.paused){
        audioEl.pause();
      }
    }else{
      setScreenClass("playing");
      if(state.playingAudio && audioEl.paused){
        audioEl.play().catch(()=>{});
      }
      requestWakeLock();
    }
  }

  function volverAConfig(){
    state.running = false;
    state.paused = false;
    state.stopRequested = false;
    state.finished = false;
    setScreenClass("");
    faseEl.textContent = "";
    estadoEl.textContent = "";
    contadorEl.textContent = "";
    detalleEl.textContent = "";
    progresoEl.textContent = "";
    barraEl.style.width = "0%";
    hintEl.textContent = "Toca en cualquier momento para pausar / continuar";
    screenEl.style.display = "none";
    configEl.style.display = "flex";
  }

  screenEl.addEventListener("click", ()=>{
    if(state.finished){
      volverAConfig();
    }else if(state.running){
      togglePause();
    }
  });

  btnConfigIniciar.addEventListener("click", ()=>{
    const segundos = parseFloat(tiempoFraseInput.value);
    if(!segundos || segundos <= 0){
      configMsgEl.textContent = "Escribe un número de segundos válido.";
      return;
    }
    configMsgEl.textContent = "";
    ESPERA_FRASE_MS = segundos * 1000;
    configEl.style.display = "none";
    screenEl.style.display = "flex";
    startGame();
  });

})();
</script>
</body>
</html>
