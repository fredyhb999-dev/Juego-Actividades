<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>Juego de Actividades</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body{
    margin:0;
    font-family:'Inter', system-ui, sans-serif;
    background:
        radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
        radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
        var(--bg);
    color:var(--fg);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
}

#app{width:100%;max-width:420px}

.eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.78rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color: var(--fg-muted);
    margin-bottom:10px;
}

h2{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:.02em;
    margin:0 0 22px;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:1.9rem;
    margin:.3em 0;
}

#timer{
    font-family:'Chakra Petch', sans-serif;
    font-size:4rem;
    font-weight:700;
    margin:.2em 0;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

#round{
    font-size:.9rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--fg-muted);
}

input{
    font-family:'Chakra Petch', sans-serif;
    font-size:1.3rem;
    padding:.7em;
    width:100%;
    box-sizing:border-box;
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    color: var(--fg);
    text-align:center;
    outline:none;
}
input:focus{ border-color: var(--teal); }

button{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    letter-spacing:.05em;
    font-size:1.1rem;
    padding:.75em;
    width:100%;
    box-sizing:border-box;
    margin-top:16px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition: transform .15s ease, opacity .2s ease;
}
button:active{ transform: scale(.97); }
button:disabled{ opacity:.5; cursor:default; }

#cargaMsg{
    margin-top:16px;
    font-size:.85rem;
    color: var(--fg-muted);
    min-height:20px;
}
#cargaMsg.error{ color: var(--coral); }

</style>
</head>
<body>

<div id="app">
<div id="setup">
<p class="eyebrow">Juego de Actividades</p>
<h2>¿Cuántas rondas?</h2>
<input id="rounds" type="number" min="1" value="">
<button id="start" disabled>Cargando actividades...</button>
<div id="cargaMsg"></div>
</div>

<div id="game" style="display:none">
<div id="round"></div>
<h1 id="title"></h1>
<div id="timer"></div>
</div>
</div>
<script>

// ======= ARCHIVO EXTERNO CON LAS ACTIVIDADES =======
// Edita "Actividades.json" (junto a este HTML) para cambiar la rutina.
// Debe ser un arreglo JSON de textos, por ejemplo:
// ["hacer lagartijas", "sentadillas", "correr"]
const ARCHIVO_ACTIVIDADES = "Actividades.json";
// ====================================================

let wakeLock = null;

async function mantenerPantallaEncendida(){

    try{
        wakeLock = await navigator.wakeLock.request("screen");
        console.log("Pantalla bloqueada para evitar suspensión");

    }catch(e){
        console.log("No se pudo activar Wake Lock", e);
    }

}

let actividades=[];

const startBtn=document.getElementById("start");
const cargaMsg=document.getElementById("cargaMsg");

async function cargarActividades(){
 cargaMsg.classList.remove("error");
 cargaMsg.textContent="Cargando actividades...";
 try{
    const res=await fetch(ARCHIVO_ACTIVIDADES, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const datos=await res.json();
    if(!Array.isArray(datos) || datos.length===0) throw new Error("Lista vacía");
    actividades=datos;
    cargaMsg.textContent=actividades.length+" actividades cargadas";
    startBtn.disabled=false;
    startBtn.textContent="Comenzar";
 }catch(e){
    cargaMsg.classList.add("error");
    cargaMsg.textContent="No se pudo cargar "+ARCHIVO_ACTIVIDADES+". Revisa que el archivo exista y tenga formato JSON válido.";
    startBtn.disabled=true;
    startBtn.textContent="Reintentar";
    startBtn.onclick=cargarActividades;
 }
}

let total=0,actual=0,estado="actividad",rest=0,intv;
let lista=[];

function mezclar(a){return [...a].sort(()=>Math.random()-0.5);}
function beep(n){
 const c=new(window.AudioContext||window.webkitAudioContext)();
 let t=c.currentTime;
 for(let i=0;i<n;i++){
  const o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.value=880;
  o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.3,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+.25);
  o.start(t);o.stop(t+.25);t+=.55;
 }
}


function fmt(s){let m=Math.floor(s/60);let ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")}


function siguienteActividad(){
 if(lista.length===0)lista=mezclar(actividades);
 actual++;
 document.getElementById("round").textContent="Ronda "+actual+" de "+total;
 document.getElementById("title").textContent=lista.pop();
 rest=(Math.floor(Math.random()*4)+1)*60;
 estado="actividad";
 beep(1);
 document.getElementById("timer").textContent=fmt(rest);
}

function tick(){
 rest--;
 document.getElementById("timer").textContent=fmt(Math.max(rest,0));
 if(rest>0)return;
 if(estado==="actividad"){
   beep(2);
   if(actual>=total){
      clearInterval(intv);
      document.getElementById("title").textContent="¡Juego terminado!";
      document.getElementById("timer").textContent="";
      return;
   }
   estado="descanso";
   document.getElementById("title").textContent="Descanso";
   rest=30;
 }else{
   siguienteActividad();
 }
}

startBtn.onclick=async()=>{
 await mantenerPantallaEncendida();
 total=parseInt(document.getElementById("rounds").value)||1;
 document.getElementById("setup").style.display="none";
 document.getElementById("game").style.display="block";
 lista=mezclar(actividades);
 actual=0;
 siguienteActividad();
 intv=setInterval(tick,1000);
};

cargarActividades();

</script>
    
</body>
</html>
