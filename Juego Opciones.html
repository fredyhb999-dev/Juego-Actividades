<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Torneo Interactivo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  text-align: center;
  padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  margin: 0;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
    radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
    var(--bg);
  color: var(--fg);
  min-height: 100vh;
}

.container {
  max-width: 700px;
  margin: auto;
}

.eyebrow{
  font-family:'Chakra Petch', sans-serif;
  font-size:.78rem;
  letter-spacing:.35em;
  text-transform:uppercase;
  color: var(--fg-muted);
  margin-bottom:10px;
}

h2{
  font-family:'Chakra Petch', sans-serif;
  font-weight:700;
  font-size:1.6rem;
  letter-spacing:.02em;
  margin:0 0 22px;
  background: linear-gradient(90deg, var(--coral), var(--teal));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

button {
  font-family:'Chakra Petch', sans-serif;
  font-weight:600;
  letter-spacing:.03em;
  font-size: 1.05rem;
  padding: 14px 22px;
  margin: 8px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  color: var(--bg);
  background: linear-gradient(90deg, var(--coral), var(--teal));
  transition: transform .15s ease, opacity .2s ease;
}

button:hover {
  opacity: 0.92;
}
button:active{
  transform: scale(.96);
}
button:disabled{
  opacity:.45;
  cursor:default;
}

#game {
  display: none;
  margin-top: 20px;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.card {
  flex: 1 1 250px;
  font-family:'Chakra Petch', sans-serif;
  font-weight:600;
  font-size: 1.35rem;
  padding: 24px;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  background: var(--card);
  min-width: 200px;
}

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

/* HISTORIAL */
#history {
  margin-top: 25px;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 14px 16px;
  border-radius: 12px;
  max-height: 200px;
  overflow-y: auto;
}

#history strong{
  font-family:'Chakra Petch', sans-serif;
  font-size:.85rem;
  letter-spacing:.05em;
  color: var(--fg-muted);
}

.history-item {
  font-size: 14px;
  padding: 7px 0;
  border-bottom: 1px solid var(--card-border);
  color: var(--fg);
}
.history-item:last-child{ border-bottom:none; }

#winner {
  font-family:'Chakra Petch', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  margin-top: 20px;
}

#cargaMsg{
  margin-top: 18px;
  font-size: .85rem;
  color: var(--fg-muted);
  min-height: 20px;
}
#cargaMsg.error{ color: var(--coral); }

/* RESPONSIVE */
@media (max-width: 600px) {
  button {
    width: 100%;
    font-size: 1rem;
  }

  .card {
    font-size: 1.15rem;
  }
}
</style>
</head>

<body>

<div class="container">

<p class="eyebrow">Elige como Sufrir</p>
<h2>🔥 Elección de Castigo</h2>

<button id="btnIniciar" onclick="start()" disabled>Cargando opciones...</button>
<div id="cargaMsg"></div>

<div id="game">

  <div class="cards">
    <div class="card" id="a">A</div>
    <div class="card" id="b">B</div>
  </div>

  <div class="actions">
    <button onclick="pick('a')">Escoge A</button>
    <button onclick="pick('b')">Escoge B</button>
  </div>

  <button onclick="start()">🔄 Reiniciar</button>

  <div id="history">
    <strong>🧾 Historial de eliminados</strong>
    <div id="historyList"></div>
  </div>

</div>

<h3 id="winner"></h3>

</div>

<script>

// ======= ARCHIVO EXTERNO CON LAS OPCIONES =======
// Edita "Juego Opciones.json" (junto a este HTML) para cambiar la lista.
// Debe ser un arreglo JSON de textos, por ejemplo:
// ["hacer lagartijas", "sentadillas", "correr"]
const ARCHIVO_OPCIONES = "Juego Opciones.json";
// ==================================================

let ORIGINAL_LIST = [];

const btnIniciar = document.getElementById("btnIniciar");
const cargaMsg = document.getElementById("cargaMsg");

async function cargarOpciones(){
  cargaMsg.classList.remove("error");
  cargaMsg.textContent = "Cargando opciones...";
  try{
    const res = await fetch(ARCHIVO_OPCIONES, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const datos = await res.json();
    if(!Array.isArray(datos) || datos.length < 2) throw new Error("Se necesitan al menos 2 opciones");
    ORIGINAL_LIST = datos;
    cargaMsg.textContent = ORIGINAL_LIST.length+" opciones cargadas";
    btnIniciar.disabled = false;
    btnIniciar.textContent = "Iniciar Juego";
  }catch(e){
    cargaMsg.classList.add("error");
    cargaMsg.textContent = "No se pudo cargar "+ARCHIVO_OPCIONES+". Revisa que el archivo exista y tenga formato JSON válido.";
    btnIniciar.disabled = true;
    btnIniciar.textContent = "Reintentar";
    btnIniciar.onclick = cargarOpciones;
  }
}

let list = [];
let currentA = null;
let currentB = null;
let round = 1;

function start(){

  list = [...ORIGINAL_LIST]; // reinicia lista
  document.getElementById("game").style.display = "block";
  document.getElementById("winner").innerText = "";
  document.getElementById("historyList").innerHTML = "";
  round = 1;

  nextRound();
}

function nextRound(){

  if(list.length === 1){
    document.getElementById("game").style.display = "none";
    document.getElementById("winner").innerText =
      "🏆 Ganador: " + list[0];
    return;
  }

  currentA = list.splice(Math.floor(Math.random() * list.length), 1)[0];
  currentB = list.splice(Math.floor(Math.random() * list.length), 1)[0];

  document.getElementById("a").innerText = "🅰️ " + currentA;
  document.getElementById("b").innerText = "🅱️ " + currentB;
}

function pick(choice){

  let eliminated;

  if(choice === "a"){
    list.push(currentB);
    eliminated = currentA;
  } else {
    list.push(currentA);
    eliminated = currentB;
  }

  addHistory(eliminated);
  round++;

  nextRound();
}

function addHistory(item){
  const div = document.createElement("div");
  div.className = "history-item";
  div.innerText = "❌ " + item;
  document.getElementById("historyList").prepend(div);
}

btnIniciar.onclick = start;
cargarOpciones();

</script>

</body>
</html>
