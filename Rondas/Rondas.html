<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>Juego por Rondas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
    --wait-glow: rgba(165, 153, 199, .35);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body{
    margin:0;
    font-family:'Inter', system-ui, sans-serif;
    background:
        radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
        radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
        var(--bg);
    color:var(--fg);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    transition: box-shadow .4s ease;
}

body.marco-jugando{ box-shadow: inset 0 0 140px var(--teal-glow); }
body.marco-esperando{ box-shadow: inset 0 0 140px var(--wait-glow); }
body.marco-pausado{ box-shadow: inset 0 0 140px var(--coral-glow); }

#app{width:100%;max-width:420px}

.eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.78rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color: var(--fg-muted);
    margin-bottom:10px;
}

h2{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:.02em;
    margin:0 0 22px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700;
    font-size:1.9rem;
    margin:.3em 0;
}

#timer{
    font-family:'Chakra Petch', sans-serif;
    font-size:4rem;
    font-weight:700;
    margin:.2em 0;
    font-variant-numeric: tabular-nums;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
#pausaMsg{
    color: var(--teal);
    font-family:'Chakra Petch', sans-serif;
    font-size:.9rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-top:8px;
    display:none;
}

#round{
    font-size:.9rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--fg-muted);
}

input{
    font-family:'Chakra Petch', sans-serif;
    font-size:1.3rem;
    padding:.7em;
    width:100%;
    box-sizing:border-box;
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    color: var(--fg);
    text-align:center;
    outline:none;
}
input:focus{ border-color: var(--teal); }

button{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600;
    letter-spacing:.05em;
    font-size:1.1rem;
    padding:.75em;
    width:100%;
    box-sizing:border-box;
    margin-top:16px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition: transform .15s ease, opacity .2s ease;
}
button:active{ transform: scale(.97); }
button:disabled{ opacity:.5; cursor:default; }

#cargaMsg{
    margin-top:16px;
    font-size:.85rem;
    color: var(--fg-muted);
    min-height:20px;
}
#cargaMsg.error{ color: var(--coral); }

</style>
</head>
<body>

<div id="app">
<div id="setup">
<p class="eyebrow">Juego por Rondas</p>
<h2>¿Cuántas rondas?</h2>
<input id="rounds" type="number" min="1" value="">
<button id="start" disabled>Cargando actividades...</button>
<div id="cargaMsg"></div>
</div>

<div id="game" style="display:none">
<div id="round"></div>
<h1 id="title"></h1>
<div id="timer"></div>
<div id="pausaMsg" style="display:none">⏸ Pausado — toca para continuar</div>
<button id="skip" style="display:none">⏭ Siguiente actividad</button>
</div>
</div>
<script>

// ======= ARCHIVO EXTERNO CON LAS ACTIVIDADES =======
// Edita "Rondas.json" (junto a este HTML) para cambiar la rutina.
// Debe ser un arreglo JSON de textos, por ejemplo:
// ["hacer lagartijas", "sentadillas", "correr"]
const ARCHIVO_ACTIVIDADES = "Rondas.json";
// ====================================================

let wakeLock = null;
let audioCtx = null;
let vozTimeout = null;
let lastSkip = 0;
let pausado = false;
let juegoTerminado = false;
let vozPausada = false;
let anuncioPendiente = null;

function marco(nombre){
    document.body.classList.remove("marco-jugando", "marco-esperando", "marco-pausado");
    if(nombre) document.body.classList.add("marco-" + nombre);
}

async function mantenerPantallaEncendida(){

    try{
        wakeLock = await navigator.wakeLock.request("screen");
        console.log("Pantalla bloqueada para evitar suspensión");

    }catch(e){
        console.log("No se pudo activar Wake Lock", e);
    }

}

let actividades=[];

const startBtn=document.getElementById("start");
const skipBtn=document.getElementById("skip");
const cargaMsg=document.getElementById("cargaMsg");

async function cargarActividades(){
 cargaMsg.classList.remove("error");
 cargaMsg.textContent="Cargando actividades...";
 try{
    const res=await fetch(ARCHIVO_ACTIVIDADES, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const datos=await res.json();
    if(!Array.isArray(datos) || datos.length===0) throw new Error("Lista vacía");
    actividades=datos;
    cargaMsg.textContent=actividades.length+" actividades cargadas";
    startBtn.disabled=false;
    startBtn.textContent="Comenzar";
 }catch(e){
    cargaMsg.classList.add("error");
    cargaMsg.textContent="No se pudo cargar "+ARCHIVO_ACTIVIDADES+". Revisa que el archivo exista y tenga formato JSON válido.";
    startBtn.disabled=true;
    startBtn.textContent="Reintentar";
    startBtn.onclick=cargarActividades;
 }
}

let total=0,actual=0,estado="actividad",rest=0,intv;
let lista=[];

function mezclar(a){return [...a].sort(()=>Math.random()-0.5);}
function beep(n){
 if(!audioCtx){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 }
 if(audioCtx.state==="suspended"){ audioCtx.resume(); }
 let t=audioCtx.currentTime;
 for(let i=0;i<n;i++){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type="sine";o.frequency.value=880;
  o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.3,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+.25);
  o.start(t);o.stop(t+.25);t+=.55;
 }
}

function vozDisponible(){
 return ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
}

function esVozFemenina(v){
  const n = String(v.name || "").toLowerCase();
  if(/female|femenina|mujer|woman/.test(n)) return true;
  const nombres = ["paulina","monica","mónica","marisol","sabina","helena","laura","maria","maría","carmen","lucia","lucía","elvira","penelope","penélope","esperanza","ximena","valeria","dalia","camila","gabriela","isabela","sofia","sofía","lupe","guadalupe","angela","ángela","irene","soledad","conchita","teresa","juana","veronica","verónica","alejandra","fernanda","renata","julia","julieta","diana","claudia","patricia","silvia","rocio","rocío","lorena","miriam","nuria"];
  return nombres.some(nombre => n.includes(nombre));
}

function buscarVozEspanol(voces){
  const normal = v => String(v.lang || "").toLowerCase().replace("_", "-");
  const paises = ["es-mx", "es-us", "es-419"];

  // Primero una voz femenina, respetando el orden de países.
  for(const pref of paises){
    const v = voces.find(x => normal(x).startsWith(pref) && esVozFemenina(x));
    if(v) return v;
  }
  const femenina = voces.find(x => normal(x).startsWith("es") && esVozFemenina(x));
  if(femenina) return femenina;

  // Si no se reconoce ninguna femenina, se usa la mejor por país.
  for(const pref of paises){
    const v = voces.find(x => normal(x).startsWith(pref));
    if(v) return v;
  }
  return voces.find(x => normal(x).startsWith("es")) || null;
}

function hablar(texto, alTerminar){
 if(!vozDisponible()){
  if(alTerminar) alTerminar();
  return;
 }
 if(window.Sonido && !window.Sonido.activo()){
  if(alTerminar) alTerminar();
  return;
 }
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(texto);
  u.lang="es-MX";
  u.rate=1;
  u.pitch=1;
  u.volume=1;
  const voz=buscarVozEspanol(speechSynthesis.getVoices());
  if(voz){ u.voice=voz; u.lang=voz.lang; }
  if(alTerminar){
   u.onend=alTerminar;
   u.onerror=alTerminar;
  }
  speechSynthesis.speak(u);
 }catch(e){
  if(alTerminar) alTerminar();
 }
}

function anunciar(texto){
 if(vozTimeout){ clearTimeout(vozTimeout); vozTimeout=null; }
 if(vozDisponible()){
  try{ speechSynthesis.cancel(); }catch(e){}
 }
 const puedeSonar = vozDisponible() && !(window.Sonido && !window.Sonido.activo());
 marco(puedeSonar ? "jugando" : "esperando");
 vozTimeout=setTimeout(()=>{
  vozTimeout=null;
  if(pausado){ anuncioPendiente=texto; return; }
  anuncioPendiente=null;
  hablar(texto, ()=>{
   if(!pausado && !juegoTerminado) marco("esperando");
  });
 },400);
}


function fmt(s){let m=Math.floor(s/60);let ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")}


function terminarJuego(){
 clearInterval(intv);
 intv=null;
 juegoTerminado=true;
 pausado=false;
 anuncioPendiente=null;
 if(vozTimeout){ clearTimeout(vozTimeout); vozTimeout=null; }
 if(vozDisponible()){ try{ speechSynthesis.cancel(); }catch(e){} }
 skipBtn.style.display="none";
 marco(null);
 document.getElementById("pausaMsg").style.display="none";
 document.getElementById("title").textContent="¡Juego terminado!";
 document.getElementById("timer").textContent="";
}

function siguienteActividad(){
 if(lista.length===0)lista=mezclar(actividades);
 actual++;
 document.getElementById("round").textContent="Ronda "+actual+" de "+total;
 const act=lista.pop();
 document.getElementById("title").textContent=act;
 rest=(Math.floor(Math.random()*4)+1)*60;
 estado="actividad";
 pausado=false;
 document.getElementById("pausaMsg").style.display="none";
 skipBtn.style.display="block";
 beep(1);
 anunciar(act);
 document.getElementById("timer").textContent=fmt(rest);
}

function tick(){
 if(pausado) return;
 rest--;
 document.getElementById("timer").textContent=fmt(Math.max(rest,0));
 if(rest===10 && estado==="actividad"){
   hablar("Quedan 10 segundos.", ()=>{ if(!pausado && !juegoTerminado) marco("esperando"); });
 }
 if(rest>0)return;
 if(estado==="actividad"){
   beep(2);
   if(actual>=total){
      terminarJuego();
      return;
   }
   estado="descanso";
   skipBtn.style.display="none";
   document.getElementById("title").textContent="Descanso";
   rest=30;
   document.getElementById("timer").textContent=fmt(rest);
   marco("esperando");
 }else{
   siguienteActividad();
 }
}

function saltarActividad(){
 if(estado!=="actividad") return;
 const ahora=Date.now();
 if(ahora-lastSkip<800) return;
 lastSkip=ahora;
 if(pausado){ pausado=false; vozPausada=false; document.getElementById("pausaMsg").style.display="none"; }
 if(actual>=total){
   beep(2);
   terminarJuego();
   return;
 }
 if(!intv) intv=setInterval(tick,1000);
 siguienteActividad();
}

startBtn.onclick=(e)=>{
 e.stopPropagation();
 mantenerPantallaEncendida();
 if(vozDisponible()){ try{ speechSynthesis.cancel(); }catch(e){} }
 total=parseInt(document.getElementById("rounds").value)||1;
 document.getElementById("setup").style.display="none";
 document.getElementById("game").style.display="block";
 lista=mezclar(actividades);
 actual=0;
 lastSkip=0;
 pausado=false;
 juegoTerminado=false;
 vozPausada=false;
 anuncioPendiente=null;
 document.getElementById("pausaMsg").style.display="none";
 marco("esperando");
 siguienteActividad();
 intv=setInterval(tick,1000);
};

skipBtn.onclick=(e)=>{
 e.stopPropagation();
 saltarActividad();
};

document.body.onclick=(e)=>{
 if(juegoTerminado) return;
 if(document.getElementById("setup").style.display!=="none") return;
 if(e.target && e.target.closest && e.target.closest("#skip, #jv-sonido, #jv-volver")) return;
 if(pausado){
   pausado=false;
   document.getElementById("pausaMsg").style.display="none";
   if(!intv) intv=setInterval(tick,1000);
   if(vozPausada){
     try{ speechSynthesis.resume(); }catch(e){}
     vozPausada=false;
     marco("jugando");
   }else if(anuncioPendiente){
     const t=anuncioPendiente;
     anuncioPendiente=null;
     anunciar(t);
   }else{
     marco("esperando");
   }
 }else{
   if(!intv) return;
   pausado=true;
   clearInterval(intv); intv=null;
   document.getElementById("pausaMsg").style.display="block";
   vozPausada = vozDisponible() && speechSynthesis.speaking;
   if(vozPausada){
     try{ speechSynthesis.pause(); }catch(e){}
   }
   marco("pausado");
 }
};

cargarActividades();

</script>
    
<script src="../js/volver.js" data-padre="../Juegos.html"></script>
<script src="../js/sonido.js"></script>
<script src="../js/voz.js"></script>
<script src="../js/ruido.js" data-archivo="Comportamiento.json"></script>
</body>
</html>
