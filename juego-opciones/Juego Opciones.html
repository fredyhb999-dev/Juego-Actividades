<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Torneo Interactivo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  text-align: center;
  padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  margin: 0;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
    radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
    var(--bg);
  color: var(--fg);
  min-height: 100vh;
}

.container {
  max-width: 700px;
  margin: auto;
}

.eyebrow{
  font-family:'Chakra Petch', sans-serif;
  font-size:.78rem;
  letter-spacing:.35em;
  text-transform:uppercase;
  color: var(--fg-muted);
  margin-bottom:10px;
}

h2{
  font-family:'Chakra Petch', sans-serif;
  font-weight:700;
  font-size:1.6rem;
  letter-spacing:.02em;
  margin:0 0 22px;
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
  background: linear-gradient(90deg, var(--coral), var(--teal));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

button {
  font-family:'Chakra Petch', sans-serif;
  font-weight:600;
  letter-spacing:.03em;
  font-size: 1.05rem;
  padding: 14px 22px;
  margin: 8px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  color: var(--bg);
  background: linear-gradient(90deg, var(--coral), var(--teal));
  transition: transform .15s ease, opacity .2s ease;
}

button:hover {
  opacity: 0.92;
}
button:active{
  transform: scale(.96);
}
button:disabled{
  opacity:.45;
  cursor:default;
}

#game {
  display: none;
  margin-top: 20px;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.card {
  flex: 1 1 250px;
  font-family:'Chakra Petch', sans-serif;
  font-weight:600;
  font-size: 1.35rem;
  padding: 24px;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  background: var(--card);
  min-width: 200px;
}

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

/* HISTORIAL */
#history {
  margin-top: 25px;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 14px 16px;
  border-radius: 12px;
  max-height: 200px;
  overflow-y: auto;
}

#history strong{
  font-family:'Chakra Petch', sans-serif;
  font-size:.85rem;
  letter-spacing:.05em;
  color: var(--fg-muted);
}

.history-item {
  font-size: 14px;
  padding: 7px 0;
  border-bottom: 1px solid var(--card-border);
  color: var(--fg);
}
.history-item:last-child{ border-bottom:none; }

#winner {
  font-family:'Chakra Petch', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  margin-top: 20px;
}

#cargaMsg{
  margin-top: 18px;
  font-size: .85rem;
  color: var(--fg-muted);
  min-height: 20px;
}
#cargaMsg.error{ color: var(--coral); }

/* FILA BOTONES INFERIORES */
.fila-botones{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}
.fila-botones button{
  flex:1;
  min-width:0;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  button {
    width: 100%;
    font-size: 1rem;
  }

  .card {
    font-size: 1.15rem;
  }
}

/* ---------- MODAL RUTINAS ---------- */
#modalRutinas{
  position:fixed; inset:0; z-index:10000;
  display:none; align-items:center; justify-content:center;
  padding:20px;
}
.modal-overlay{
  position:absolute; inset:0;
  background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
}
.modal-content{
  position:relative; background:var(--card);
  border:1px solid var(--card-border); border-radius:16px;
  width:100%; max-width:420px; max-height:90vh;
  display:flex; flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.6); z-index:10001;
}
.modal-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 18px; border-bottom:1px solid var(--card-border);
}
.modal-header h3{
  margin:0; font-family:'Chakra Petch', sans-serif; font-size:1.1rem;
}
.modal-cerrar{
  background:transparent; border:none; color:var(--fg-muted);
  font-size:1.6rem; cursor:pointer; padding:0 4px; line-height:1;
}
.modal-cerrar:hover{ color:var(--fg); }
.modal-body{
  padding:16px 18px; overflow-y:auto; flex:1;
}
.modal-footer{
  padding:12px 18px; border-top:1px solid var(--card-border);
  text-align:right;
}
.btn-cerrar-modal{
  background:transparent; border:1px solid var(--card-border);
  color:var(--fg); padding:8px 16px; border-radius:8px;
  cursor:pointer; font-family:inherit;
}
.btn-cerrar-modal:hover{ background:rgba(255,255,255,.05); }
.rutina-item{
  width:100%; text-align:left; padding:12px 14px;
  background:var(--bg-2); border:1px solid var(--card-border);
  border-radius:12px; margin-bottom:8px;
  font-family:'Inter', sans-serif; font-size:.95rem; color:var(--fg);
  cursor:pointer; transition:border-color .15s ease, transform .1s ease;
}
.rutina-item:active{ transform:scale(.98); }
.rutina-item:hover{ border-color:var(--teal); }
.rutina-estado{
  font-size:.8rem; margin-top:4px; min-height:1.2em;
}
.rutina-estado.ok{ color:var(--verde); }
.rutina-estado.err{ color:var(--coral); }
</style>
</head>

<body>

<div class="container">

<p class="eyebrow">Elige como Sufrir</p>
<h2>🔥 Elección de Castigo</h2>

<button id="btnIniciar" onclick="start()" disabled>Cargando opciones...</button>
<div id="cargaMsg"></div>

<div id="game">

<!-- Modal Rutinas -->
<div id="modalRutinas" class="modal" style="display:none;">
  <div class="modal-overlay" onclick="cerrarModalRutinas()"></div>
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>Rutinas de Alexa</h3>
      <button class="modal-cerrar" onclick="cerrarModalRutinas()">✕</button>
    </div>
    <div class="modal-body">
      <div id="modalRutinasMsg" style="font-size:.85rem; color:var(--fg-muted); min-height:20px;"></div>
      <div id="listaRutinas" style="max-height:300px; overflow-y:auto; margin-top:10px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cerrar-modal" onclick="cerrarModalRutinas()">Cerrar</button>
    </div>
  </div>
</div>

  <div class="cards">
    <div class="card" id="a">A</div>
    <div class="card" id="b">B</div>
  </div>

  <div class="actions">
    <button onclick="pick('a')">Escoge A</button>
    <button onclick="pick('b')">Escoge B</button>
  </div>

  <div class="fila-botones">
    <button onclick="start()">🔄 Reiniciar</button>
    <button id="btnRutinas" disabled onclick="abrirModalRutinas()">Rutinas Alexa</button>
  </div>

  <div id="history">
    <strong>🧾 Historial de eliminados</strong>
    <div id="historyList"></div>
  </div>

</div>

<h3 id="winner"></h3>

</div>

<script>

// ======= ARCHIVO EXTERNO CON LAS OPCIONES =======
// Edita "Juego Opciones.json" (junto a este HTML) para cambiar la lista.
// Debe ser un arreglo JSON de textos, por ejemplo:
// ["hacer lagartijas", "sentadillas", "correr"]
const ARCHIVO_OPCIONES = "Juego Opciones.json";
// ==================================================

let ORIGINAL_LIST = [];

const btnIniciar = document.getElementById("btnIniciar");
const cargaMsg = document.getElementById("cargaMsg");

async function cargarOpciones(){
  cargaMsg.classList.remove("error");
  cargaMsg.textContent = "Cargando opciones...";
  try{
    const res = await fetch(ARCHIVO_OPCIONES, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const datos = await res.json();
    if(!Array.isArray(datos) || datos.length < 2) throw new Error("Se necesitan al menos 2 opciones");
    ORIGINAL_LIST = datos;
    cargaMsg.textContent = ORIGINAL_LIST.length+" opciones cargadas";
    btnIniciar.disabled = false;
    btnIniciar.textContent = "Iniciar Juego";
  }catch(e){
    cargaMsg.classList.add("error");
    cargaMsg.textContent = "No se pudo cargar "+ARCHIVO_OPCIONES+". Revisa que el archivo exista y tenga formato JSON válido.";
    btnIniciar.disabled = true;
    btnIniciar.textContent = "Reintentar";
    btnIniciar.onclick = cargarOpciones;
  }
}

let list = [];
let currentA = null;
let currentB = null;
let round = 1;
let wakeLock = null;

// ---------- Wake Lock ----------
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){
    console.warn("No se pudo activar Wake Lock:", e);
  }
}
function releaseWakeLock(){
  if(wakeLock){
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible"){
    await requestWakeLock();
  }
});

async function start(){

  list = [...ORIGINAL_LIST]; // reinicia lista
  document.getElementById("game").style.display = "block";
  document.getElementById("winner").innerText = "";
  document.getElementById("historyList").innerHTML = "";
  round = 1;

  btnRutinasEl.disabled = false;

  await requestWakeLock();
  nextRound();
}

function nextRound(){

  if(list.length === 1){
    btnRutinasEl.disabled = true;
    releaseWakeLock();
    document.getElementById("game").style.display = "none";
    document.getElementById("winner").innerText =
      "🏆 Ganador: " + list[0];
    return;
  }

  currentA = list.splice(Math.floor(Math.random() * list.length), 1)[0];
  currentB = list.splice(Math.floor(Math.random() * list.length), 1)[0];

  document.getElementById("a").innerText = "🅰️ " + currentA;
  document.getElementById("b").innerText = "🅱️ " + currentB;
}

function pick(choice){

  let eliminated, elegida;

  if(choice === "a"){
    list.push(currentB);
    eliminated = currentA;
    elegida = currentA;
  } else {
    list.push(currentA);
    eliminated = currentB;
    elegida = currentB;
  }

  addHistory(eliminated);
  hablar(elegida);
  round++;

  nextRound();
}

function hablar(texto){
  if(!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    u.rate = 1;
    u.pitch = 1;
    u.volume = 1;
    const voces = speechSynthesis.getVoices();
    const vEspanol = voces.find(v => v.lang && v.lang.toLowerCase().indexOf("es") === 0);
    if(vEspanol) u.voice = vEspanol;
    speechSynthesis.speak(u);
  }catch(e){}
}

function addHistory(item){
  const div = document.createElement("div");
  div.className = "history-item";
  div.innerText = "❌ " + item;
  document.getElementById("historyList").prepend(div);
}

// ---------- Modal Rutinas ----------
let rutinasLista = [];
const modalRutinasEl = document.getElementById("modalRutinas");
const listaRutinasEl = document.getElementById("listaRutinas");
const btnRutinasEl = document.getElementById("btnRutinas");
const modalMsgEl = document.getElementById("modalRutinasMsg");

async function cargarRutinasModal(){
  modalMsgEl.textContent = "Cargando rutinas...";
  try{
    const res = await fetch("../acciones.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    rutinasLista = await res.json();
    if(Array.isArray(rutinasLista) && rutinasLista.length > 0){
      btnRutinasEl.disabled = false;
      modalMsgEl.textContent = "";
    } else {
      modalMsgEl.textContent = "No hay rutinas disponibles.";
    }
  }catch(e){
    modalMsgEl.textContent = "No se pudieron cargar las rutinas.";
    btnRutinasEl.disabled = true;
  }
}

function renderRutinas(){
  listaRutinasEl.innerHTML = "";
  rutinasLista.forEach((a, i)=>{
    const div = document.createElement("div");
    div.className = "rutina-item";
    div.textContent = a.accion || `Rutina ${i+1}`;
    div.onclick = async ()=>{
      div.style.opacity = ".6";
      const estado = document.createElement("div");
      estado.className = "rutina-estado";
      estado.textContent = "Enviando...";
      div.appendChild(estado);
      try{
        await fetch(a.link, { mode:"no-cors", cache:"no-store" });
        estado.className = "rutina-estado ok";
        estado.textContent = "Enviado ✓";
      }catch(err){
        estado.className = "rutina-estado err";
        estado.textContent = "Error al enviar";
      }
      setTimeout(cerrarModalRutinas, 900);
    };
    listaRutinasEl.appendChild(div);
  });
}

function abrirModalRutinas(){
  renderRutinas();
  modalRutinasEl.style.display = "flex";
}
function cerrarModalRutinas(){
  modalRutinasEl.style.display = "none";
}

btnRutinasEl.onclick = abrirModalRutinas;

btnIniciar.onclick = start;
cargarOpciones();
cargarRutinasModal();

</script>

<script src="../js/volver.js" data-padre="../Juegos.html"></script>
</body>
</html>
