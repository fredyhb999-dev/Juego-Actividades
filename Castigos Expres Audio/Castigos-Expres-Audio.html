<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Castigos Exprés Audio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --coral-glow: rgba(255, 106, 92, .35);
    --teal-glow: rgba(47, 217, 199, .35);
    --wait-glow: rgba(165, 153, 199, .35);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    user-select:none;
  }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; letter-spacing:.35em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:14px;
  }

  /* ---------- pantalla de configuración ---------- */
  #config{
    height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    overflow-y:auto;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  #config h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 10px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #config p{
    font-size:.88rem; color:var(--fg-muted); max-width:320px; margin:0 0 26px;
  }
  #config .campo{
    width:100%; max-width:280px;
    display:flex; flex-direction:column;
    align-items:center;
    margin-bottom:18px;
  }
  #config .campo label{
    font-size:.85rem; color:var(--fg-muted); margin-bottom:8px;
  }
  #config input{
    width:100%; max-width:200px;
    font-size:1.4rem; text-align:center;
    padding:12px; margin-bottom:0;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
  }
  #config select{
    width:100%; max-width:260px;
    font-size:1.05rem; text-align:center; text-align-last:center;
    padding:12px;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
  }
  #config .campo-temas{ max-width:100%; }
  .temas{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    width:100%;
  }
  #config .tema-chip{
    font-family:'Chakra Petch', sans-serif;
    font-size:.9rem; font-weight:600; letter-spacing:0;
    width:auto; max-width:none;
    padding:9px 16px; margin-top:0;
    border-radius:999px;
    background: var(--bg-2);
    border:1px solid var(--card-border);
    color: var(--fg-muted);
    cursor:pointer;
  }
  #config .tema-chip.activo{
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border-color: transparent;
  }
  #config button{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; letter-spacing:.06em; font-size:1.05rem;
    width:100%; max-width:260px;
    padding:16px; margin-top:8px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    border:none; border-radius:14px;
    cursor:pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  #config button:active{ transform: scale(.97); }
  #config button:disabled{ opacity:.4; cursor:default; }
  #configMsg{
    margin-top:14px; font-size:.85rem; color:var(--coral); min-height:18px;
  }

  /* ---------- pantalla de reproducción ---------- */
  #player{
    display:none;
    height:100dvh; width:100vw;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
    transition: background-color .4s ease, box-shadow .4s ease;
    cursor:pointer;
  }
  #player.playing{ box-shadow: inset 0 0 140px var(--teal-glow); }
  #player.paused{ box-shadow: inset 0 0 140px var(--coral-glow); }
  #player.esperando{ box-shadow: inset 0 0 140px var(--wait-glow); }
  #player.terminado{ box-shadow: inset 0 0 140px var(--coral-glow); }

  #icono{
    font-size:100px;
    line-height:1;
    margin-bottom:10px;
  }
  #categoriaAudio{
    display:none;
    margin-top:14px; padding:5px 14px; border-radius:20px;
    font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    background: rgba(47,217,199,.15); color: var(--teal);
  }
  #categoriaAudio.visible{ display:block; }
  #nombreAudio{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.7rem; margin-top:15px;
    max-width:90%;
    word-break:break-word;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #progreso{
    font-family:'Chakra Petch', sans-serif;
    font-size:.78rem; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--fg-muted);
    margin-top:10px;
    font-variant-numeric: tabular-nums;
  }
  #estadoPlayer{
    font-size:1.05rem; margin-top:14px; color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }
  #contador{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:3.2rem; margin-top:12px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #contador.hidden{ display:none; }
  #siguiente{
    margin-top:26px;
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--teal);
    padding:12px 20px;
    border:1px solid var(--card-border); border-radius:12px;
    background: var(--card);
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  #siguiente:active{ border-color: var(--teal); }
  #extra{
    margin-top:10px;
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--coral);
    padding:12px 20px;
    border:1px solid var(--card-border); border-radius:12px;
    background: var(--card);
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  #extra:active{ border-color: var(--coral); }
  #info{
    position:absolute; bottom:max(74px, calc(env(safe-area-inset-bottom) + 40px));
    font-size:.8rem; color: var(--fg-muted); opacity:.7;
    text-align:center;
    left:0; right:0;
  }

  /* ---------- RECOMPENSA CADA 10 AUDIOS ---------- */
  #modalRecompensa{
    position:fixed; inset:0; z-index:10050;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(8,6,14,.75);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .recompensa-card{
    width:100%; max-width:340px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:28px 22px;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .recompensa-icono{
    font-size:52px; line-height:1; margin-bottom:12px;
  }
  .recompensa-titulo{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.5rem; line-height:1.25;
    margin-bottom:22px;
    background:linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .recompensa-boton{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; letter-spacing:.06em; font-size:1.05rem;
    width:100%; padding:14px;
    color:var(--bg);
    background:linear-gradient(90deg, var(--coral), var(--teal));
    border:none; border-radius:14px;
    cursor:pointer;
    transition: transform .15s ease;
  }
  .recompensa-boton:active{ transform:scale(.97); }
</style>
</head>

<body>

<div id="config">
  <div class="eyebrow">Castigos Exprés Audio</div>
  <h1>Configura la reproducción</h1>

  <div class="campo campo-temas">
    <label>Temas (hasta 2)</label>
    <div id="temas" class="temas"></div>
  </div>

  <div class="campo">
    <label for="minutos">Minutos entre cada audio</label>
    <input id="minutos" type="number" min="0.5" step="0.5" value="4" inputmode="decimal">
  </div>

  <div class="campo">
    <label for="proporcion">Castigos Inferiores por cada Experto</label>
    <input id="proporcion" type="number" min="1" step="1" value="2" inputmode="numeric">
  </div>

  <button id="btnIniciar">Iniciar</button>
  <div id="configMsg"></div>
</div>

<div id="player">
  <div id="icono">⏸</div>
  <div id="categoriaAudio"></div>
  <div id="nombreAudio"></div>
  <div id="progreso">1 de 10</div>
  <div id="estadoPlayer"></div>
  <div id="contador" class="hidden"></div>
  <button id="siguiente">⏭ Siguiente audio</button>
  <button id="extra" style="display:none">🎲 Acción extra</button>
  <div id="info">
    Toca cualquier parte de la pantalla
    <br>
    para Pausar / Reanudar
  </div>
</div>

<div id="modalRecompensa">
  <div class="recompensa-card">
    <div class="recompensa-icono">🎁</div>
    <div class="recompensa-titulo">Cobra tu recompensa</div>
    <button id="btnAceptar" class="recompensa-boton">Aceptar</button>
  </div>
</div>

<audio id="audio"></audio>
<audio id="audioExtra"></audio>

<script>

//==============================
// CONFIGURA AQUÍ TU REPOSITORIO
//==============================
const USUARIO = "fredyhb999-dev";
const REPO    = "Juego-Actividades";
const CARPETA = "Castigos Varios en Audio";
const SUBCARPETA_0 = "Principiante"; // se baraja aparte
const SUBCARPETA_1 = "Avanzado";     // se baraja aparte
const SUBCARPETA_2 = "Experto";      // va uno al final de cada vuelta
const SUBCARPETA_EXTRAS = "Extras";  // acción extra: botón suelto, fuera de la vuelta
//==============================

const configEl=document.getElementById("config");
const temasEl=document.getElementById("temas");
const minutosInput=document.getElementById("minutos");
const proporcionInput=document.getElementById("proporcion");
const btnIniciar=document.getElementById("btnIniciar");
const configMsg=document.getElementById("configMsg");
const player=document.getElementById("player");
const audio=document.getElementById("audio");
const icono=document.getElementById("icono");
const categoriaAudio=document.getElementById("categoriaAudio");
const nombre=document.getElementById("nombreAudio");
const estadoPlayer=document.getElementById("estadoPlayer");
const contador=document.getElementById("contador");
const progreso=document.getElementById("progreso");
const btnSiguiente=document.getElementById("siguiente");
const btnExtra=document.getElementById("extra");
const audioExtra=document.getElementById("audioExtra");
const modalRecompensa=document.getElementById("modalRecompensa");
const btnAceptar=document.getElementById("btnAceptar");

const CLAVE_CFG="audio_c4minutos_cfg";

let listaPrincipiante=[];
let listaAvanzado=[];
let listaExperto=[];
let barajaPrincipiante=[];
let barajaAvanzado=[];
let barajaExperto=[];
let ultimoPrincipiante=null;
let ultimoAvanzado=null;
let ultimoExperto=null;
let proporcion=2;   // castigos inferiores por cada experto
let cicloFases=[];  // orden de la vuelta: P, P, A, A, E…
let indiceCiclo=0;
let colaUnaVez=[];  // audios 1vez, se juegan en bloque
let bloqueHecho=false;
let pasosCiclo=0;   // audios normales desde el inicio, para contar vueltas
let minutosEspera=4;
let temasElegidos=[];   // hasta 2 temas marcados
let temasActuales=[];   // los que están sonando en esta partida
let temasGuardados=[];
let wakeLock=null;
let pausadoManual=false;
let esperaPausada=false;
let intervalo=null;
let tiempoRestante=0;
let itemActual=null;
let fallosConsecutivos=0;
let falloContado=false;
let detenido=false;

// Acción extra
let listaExtras=[];
let ultimoExtra=null;
let enExtra=false;
let recuerdo=null;      // estado de la partida antes de entrar al extra
let intervaloExtra=null;
let tiempoExtra=0;

// Recompensa cada 10 audios normales
let accionesHechas=0;
let recompensaAbierta=false;
let recompensaAccion="espera";
let recompensaAntes=null;

const extensionesAudio=[".mp3",".wav",".ogg",".m4a",".aac"];

function esAudio(nombreArchivo){
    const n=nombreArchivo.toLowerCase();
    return extensionesAudio.some(ext=>n.endsWith(ext));
}

// Los que empiezan con "1vez" (sin importar mayúsculas ni espacio) solo suenan una vez por partida.
function esUnaVez(nombreArchivo){
    return /^1\s*vez\b/i.test(nombreArchivo);
}

function nombreVisible(n){
    const p=n.lastIndexOf(".");
    return p>0 ? n.substring(0,p) : n;
}

// Los archivos de Principiante traen prefijo de secuencia (001 5 T.mp3).
// Se quita SOLO en esa carpeta para no romper nombres como "10 C" o "20 T".
function nombreMostrar(item){
    if(item.categoria==="Principiante"){
        return item.nombre.replace(/^\d+\s+/,"");
    }
    return item.nombre;
}

function seg_a_mmss(s){
    const m=Math.floor(s/60);
    const ss=s%60;
    return m+":"+String(ss).padStart(2,"0");
}

//---------------------------------------------
// La configuración se recuerda entre visitas
//---------------------------------------------
function cargarCfg(){
    try{
        const raw=localStorage.getItem(CLAVE_CFG);
        if(!raw) return;
        const c=JSON.parse(raw);
        if(c.minutos) minutosInput.value=c.minutos;
        if(c.proporcion) proporcionInput.value=c.proporcion;
        if(Array.isArray(c.temas)){
            temasGuardados=c.temas.slice(0,2);
        }else if(c.tema){
            // Compatibilidad con la versión anterior, que guardaba un solo tema.
            temasGuardados=[c.tema];
        }
    }catch(e){}
}

function guardarCfg(){
    try{
        localStorage.setItem(CLAVE_CFG,JSON.stringify({
            minutos:minutosInput.value,
            proporcion:proporcionInput.value,
            temas:temasElegidos
        }));
    }catch(e){}
}

//---------------------------------------------
// Los temas son las carpetas que hay dentro de CARPETA.
// Cada tema debe traer sus niveles (Principiante, Avanzado, Experto).
//---------------------------------------------
async function cargarTemas(){
    temasEl.innerHTML="";
    temasElegidos=[];

    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(CARPETA);
    const res=await fetch(url);
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta de temas");
    }
    const datos=await res.json();
    const temas=datos
        .filter(item=>item.type==="dir")
        .map(item=>item.name)
        .sort((a,b)=>a.localeCompare(b,"es"));

    if(temas.length===0){
        temasEl.textContent="No hay temas";
        return;
    }

    temas.forEach(nombre=>{
        const boton=document.createElement("button");
        boton.type="button";
        boton.className="tema-chip";
        boton.textContent=nombre;
        boton.setAttribute("aria-pressed","false");

        if(temasGuardados.includes(nombre) && temasElegidos.length<2){
            temasElegidos.push(nombre);
            boton.classList.add("activo");
            boton.setAttribute("aria-pressed","true");
        }

        boton.addEventListener("click",()=>alternarTema(nombre,boton));
        temasEl.appendChild(boton);
    });
}

function alternarTema(nombre,boton){
    const i=temasElegidos.indexOf(nombre);

    if(i>=0){
        temasElegidos.splice(i,1);
        boton.classList.remove("activo");
        boton.setAttribute("aria-pressed","false");
        configMsg.textContent="";
        guardarCfg();
        return;
    }

    if(temasElegidos.length>=2){
        configMsg.textContent="Máximo 2 temas.";
        return;
    }

    temasElegidos.push(nombre);
    boton.classList.add("activo");
    boton.setAttribute("aria-pressed","true");
    configMsg.textContent="";
    guardarCfg();

    if(configMsg.textContent==="Máximo 2 temas."){
        configMsg.textContent="";
    }
}

async function iniciarTemas(){
    try{
        await cargarTemas();
    }catch(e){
        temasEl.textContent="No se pudieron cargar";
        configMsg.textContent="No se pudieron cargar los temas. Recarga la página.";
    }
}

//---------------------------------------------
async function mantenerPantalla(){
    try{
        if('wakeLock' in navigator){
            wakeLock=await navigator.wakeLock.request('screen');
            wakeLock.addEventListener("release",()=>{});
        }
    }catch(e){}
}

document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible" && wakeLock==null){
        await mantenerPantalla();
    }
});

//---------------------------------------------
async function listarAudiosDe(ruta){
    const url="https://api.github.com/repos/"+USUARIO+"/"+REPO+"/contents/"+encodeURIComponent(ruta);
    const res=await fetch(url);
    // Un tema puede no tener alguno de los niveles: se usa con lo que haya.
    if(res.status===404){
        return [];
    }
    if(!res.ok){
        throw new Error("No se pudo leer la carpeta: "+ruta);
    }
    const datos=await res.json();
    const lista=datos.filter(item=>item.type==="file" && esAudio(item.name));
    return lista.map(item=>({nombre:nombreVisible(item.name),url:item.download_url}));
}

async function cargarAudios(temas){
    listaPrincipiante=[];
    listaAvanzado=[];
    listaExperto=[];
    listaExtras=[];

    const unaVez={Principiante:[],Avanzado:[],Experto:[]};

    for(const tema of temas){
        const raiz=CARPETA+"/"+tema;

        (await listarAudiosDe(raiz+"/"+SUBCARPETA_0)).forEach(item=>{
            const obj=Object.assign({},item,{categoria:"Principiante",unaVez:esUnaVez(item.nombre)});
            (obj.unaVez ? unaVez.Principiante : listaPrincipiante).push(obj);
        });

        (await listarAudiosDe(raiz+"/"+SUBCARPETA_1)).forEach(item=>{
            const obj=Object.assign({},item,{categoria:"Avanzado",unaVez:esUnaVez(item.nombre)});
            (obj.unaVez ? unaVez.Avanzado : listaAvanzado).push(obj);
        });

        (await listarAudiosDe(raiz+"/"+SUBCARPETA_2)).forEach(item=>{
            const obj=Object.assign({},item,{categoria:"Experto",unaVez:esUnaVez(item.nombre)});
            (obj.unaVez ? unaVez.Experto : listaExperto).push(obj);
        });

        (await listarAudiosDe(raiz+"/"+SUBCARPETA_EXTRAS)).forEach(item=>{
            listaExtras.push(Object.assign({},item,{categoria:"Extras"}));
        });
    }

    // Los 1vez se guardan aparte, barajados dentro de cada nivel.
    colaUnaVez=mezclar(unaVez.Principiante)
        .concat(mezclar(unaVez.Avanzado))
        .concat(mezclar(unaVez.Experto));
    bloqueHecho=(colaUnaVez.length===0);
}

function construirCiclo(){
    cicloFases=[];

    if(listaPrincipiante.length>0){
        for(let i=0;i<proporcion;i++) cicloFases.push("principiante");
    }
    if(listaAvanzado.length>0){
        for(let i=0;i<proporcion;i++) cicloFases.push("avanzado");
    }
    if(listaExperto.length>0){
        cicloFases.push("experto");
    }

    indiceCiclo=0;
}

//---------------------------------------------
function mezclar(arr){
    const copia=arr.slice();
    for(let i=copia.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [copia[i],copia[j]]=[copia[j],copia[i]];
    }
    return copia;
}

function sacarDeBaraja(categoria){

    if(categoria==="principiante"){
        if(barajaPrincipiante.length===0){
            barajaPrincipiante=mezclar(listaPrincipiante);
            if(barajaPrincipiante.length>1 && barajaPrincipiante[0].nombre===ultimoPrincipiante){
                [barajaPrincipiante[0],barajaPrincipiante[1]]=[barajaPrincipiante[1],barajaPrincipiante[0]];
            }
        }
        const item=barajaPrincipiante.shift();
        ultimoPrincipiante=item.nombre;
        return item;
    }

    if(categoria==="avanzado"){
        if(barajaAvanzado.length===0){
            barajaAvanzado=mezclar(listaAvanzado);
            if(barajaAvanzado.length>1 && barajaAvanzado[0].nombre===ultimoAvanzado){
                [barajaAvanzado[0],barajaAvanzado[1]]=[barajaAvanzado[1],barajaAvanzado[0]];
            }
        }
        const item=barajaAvanzado.shift();
        ultimoAvanzado=item.nombre;
        return item;
    }

    if(barajaExperto.length===0){
        barajaExperto=mezclar(listaExperto);
        if(barajaExperto.length>1 && barajaExperto[0].nombre===ultimoExperto){
            [barajaExperto[0],barajaExperto[1]]=[barajaExperto[1],barajaExperto[0]];
        }
    }
    const item=barajaExperto.shift();
    ultimoExperto=item.nombre;
    return item;
}

function categoriaDisponible(categoria){
    if(categoria==="principiante") return listaPrincipiante.length>0;
    if(categoria==="avanzado") return listaAvanzado.length>0;
    return listaExperto.length>0;
}

function siguienteAudio(){
    // Bloque de 1vez: después de dos vueltas completas, todos seguidos.
    if(!bloqueHecho && colaUnaVez.length>0 &&
       (cicloFases.length===0 || pasosCiclo>=cicloFases.length*2)){
        const item=colaUnaVez.shift();
        if(colaUnaVez.length===0) bloqueHecho=true;
        return item;
    }

    if(cicloFases.length===0) return null;

    for(let i=0;i<cicloFases.length;i++){
        const categoria=cicloFases[indiceCiclo];
        indiceCiclo=(indiceCiclo+1)%cicloFases.length;

        if(categoriaDisponible(categoria)){
            pasosCiclo++;
            return sacarDeBaraja(categoria);
        }
    }

    return null;
}

//---------------------------------------------
function reproducir(item){

    if(detenido) return;

    esperaPausada=false;
    itemActual=item;
    falloContado=false;
    clearInterval(intervalo);
    intervalo=null;

    audio.pause();
    audio.src=item.url;
    audio.load();

    audio.play()
    .then(()=>{
        fallosConsecutivos=0;
        accionesHechas++;
        actualizarProgreso();
        player.className="playing";
        icono.textContent="⏸";
        categoriaAudio.textContent=(temasActuales.length ? temasActuales.join(" + ") + " · " : "") + (item.categoria || "");
        categoriaAudio.className="visible";
        nombre.textContent=nombreMostrar(item);
        estadoPlayer.textContent="Reproduciendo";
        contador.className="hidden";
        contador.textContent="";
        btnSiguiente.style.display="";
    })
    .catch(()=>{
        falloDeAudio();
    });

}

function falloDeAudio(){

    // play() y onerror pueden avisar del mismo fallo: se cuenta una sola vez
    if(falloContado || detenido) return;
    falloContado=true;
    fallosConsecutivos++;

    if(fallosConsecutivos>=3){
        detener("No se pudieron reproducir 3 audios seguidos. Revisa tu conexión.");
        return;
    }

    programarSiguiente(0);
}

function avanzar(){
    if(detenido) return;
    const item=siguienteAudio();
    if(!item){
        detener("No quedan audios disponibles.");
        return;
    }
    reproducir(item);
}

function programarSiguiente(minutos){

    if(detenido) return;

    player.className="esperando";
    icono.textContent="⏳";
    btnSiguiente.style.display="";

    tiempoRestante=Math.max(0,Math.round(minutos*60));
    clearInterval(intervalo);
    intervalo=null;

    // Sin espera: pequeño retardo para que el error sea visible
    if(tiempoRestante<=0){
        estadoPlayer.textContent="Buscando el siguiente audio...";
        contador.className="hidden";
        intervalo=setInterval(()=>{
            clearInterval(intervalo);
            intervalo=null;
            avanzar();
        },1200);
        return;
    }

    contador.className="";
    contador.textContent=seg_a_mmss(tiempoRestante);
    estadoPlayer.textContent="Siguiente audio en";
    esperaPausada=false;

    iniciarCuenta();
}

function iniciarCuenta(){
    clearInterval(intervalo);
    intervalo=setInterval(()=>{
        tiempoRestante--;
        if(tiempoRestante<=0){
            clearInterval(intervalo);
            intervalo=null;
            contador.className="hidden";
            avanzar();
        }else{
            contador.textContent=seg_a_mmss(tiempoRestante);
        }
    },1000);
}

function actualizarProgreso(){
    const n=Math.max(1,Math.min(accionesHechas,10));
    progreso.textContent=n+" de 10";
}

function hayRecompensa(){
    return accionesHechas>=10;
}

function saltarAlSiguiente(){
    if(detenido) return;
    clearInterval(intervalo);
    intervalo=null;
    pausadoManual=false;
    esperaPausada=false;

    if(hayRecompensa()){
        mostrarRecompensa("avanzar");
        return;
    }

    avanzar();
}

function mostrarRecompensa(accion){
    recompensaAbierta=true;
    recompensaAccion=accion;

    clearInterval(intervalo);
    intervalo=null;
    esperaPausada=false;
    audio.pause();

    modalRecompensa.style.display="flex";
}

btnAceptar.onclick=()=>{
    if(!recompensaAbierta) return;

    recompensaAbierta=false;
    modalRecompensa.style.display="none";
    accionesHechas=0;
    actualizarProgreso();

    const accion=recompensaAccion;
    recompensaAccion="espera";

    if(accion==="avanzar"){
        avanzar();
    }else if(accion==="continuar"){
        const antes=recompensaAntes;
        recompensaAntes=null;
        continuarPartida(antes);
    }else{
        programarSiguiente(minutosEspera);
    }
};

//---------------------------------------------
// Acción extra: interrumpe la partida, suena un audio de Extras
// y al terminar (o al volver) todo sigue donde estaba.
//---------------------------------------------
function siguienteExtra(){
    if(listaExtras.length===0) return null;

    let candidatos=listaExtras;
    if(listaExtras.length>1){
        candidatos=listaExtras.filter(i=>i.nombre!==ultimoExtra);
        if(candidatos.length===0) candidatos=listaExtras;
    }

    const item=candidatos[Math.floor(Math.random()*candidatos.length)];
    ultimoExtra=item.nombre;
    return item;
}

function entrarEnExtra(){

    if(detenido || enExtra || recompensaAbierta) return;

    const item=siguienteExtra();
    if(!item) return;

    // Se recuerda el punto exacto de la partida antes de congelarla.
    let modo;
    if(intervalo!==null) modo="espera";
    else if(esperaPausada) modo="espera-pausa";
    else if(!audio.paused) modo="audio";
    else modo="audio-pausa";

    recuerdo={
        modo:modo,
        clase:player.className,
        icono:icono.textContent,
        categoria:categoriaAudio.textContent,
        claseCategoria:categoriaAudio.className,
        nombre:nombre.textContent,
        estado:estadoPlayer.textContent,
        contadorTexto:contador.textContent,
        contadorClase:contador.className,
        tiempoRestante:tiempoRestante
    };

    enExtra=true;

    clearInterval(intervalo);
    intervalo=null;
    clearInterval(intervaloExtra);
    intervaloExtra=null;
    tiempoExtra=0;

    audio.pause();

    btnExtra.style.display="none";
    btnSiguiente.textContent="⏭ Volver";

    audioExtra.pause();
    audioExtra.src=item.url;
    audioExtra.load();

    audioExtra.play()
    .then(()=>{
        if(!enExtra) return;
        accionesHechas++;
        actualizarProgreso();
        player.className="playing";
        icono.textContent="🎲";
        categoriaAudio.textContent=(temasActuales.length ? temasActuales.join(" + ") + " · " : "") + "Extras";
        categoriaAudio.className="visible";
        nombre.textContent=nombreMostrar(item);
        estadoPlayer.textContent="Acción extra";
        contador.className="hidden";
        contador.textContent="";
    })
    .catch(()=>{
        salirDelExtra();
    });
}

function continuarCuentaExtra(){
    clearInterval(intervaloExtra);
    intervaloExtra=setInterval(()=>{
        tiempoExtra--;
        if(tiempoExtra<=0){
            clearInterval(intervaloExtra);
            intervaloExtra=null;
            salirDelExtra();
        }else{
            contador.textContent=seg_a_mmss(tiempoExtra);
        }
    },1000);
}

function iniciarCuentaExtra(){
    tiempoExtra=Math.max(0,Math.round(minutosEspera*60));

    player.className="esperando";
    icono.textContent="⏳";
    estadoPlayer.textContent="Termina la acción extra en";

    if(tiempoExtra<=0){
        salirDelExtra();
        return;
    }

    contador.className="";
    contador.textContent=seg_a_mmss(tiempoExtra);
    continuarCuentaExtra();
}

function salirDelExtra(){

    if(!enExtra) return;

    enExtra=false;

    clearInterval(intervaloExtra);
    intervaloExtra=null;
    tiempoExtra=0;

    audioExtra.pause();
    audioExtra.removeAttribute("src");
    audioExtra.load();

    btnSiguiente.textContent="⏭ Siguiente audio";
    btnExtra.style.display=(listaExtras.length>0) ? "" : "none";

    player.className=recuerdo.clase;
    icono.textContent=recuerdo.icono;
    categoriaAudio.textContent=recuerdo.categoria;
    categoriaAudio.className=recuerdo.claseCategoria;
    nombre.textContent=recuerdo.nombre;
    estadoPlayer.textContent=recuerdo.estado;
    contador.textContent=recuerdo.contadorTexto;
    contador.className=recuerdo.contadorClase;

    const antes=recuerdo;
    recuerdo=null;

    if(hayRecompensa()){
        recompensaAntes=antes;
        mostrarRecompensa("continuar");
        return;
    }

    continuarPartida(antes);
}

function continuarPartida(antes){
    if(!antes) return;

    if(antes.modo==="audio"){
        audio.play().catch(()=>falloDeAudio());
        return;
    }

    tiempoRestante=antes.tiempoRestante;

    if(antes.modo==="espera"){
        if(tiempoRestante<=0){
            programarSiguiente(0);
        }else{
            iniciarCuenta();
        }
    }
}

function detener(mensaje){
    detenido=true;
    clearInterval(intervalo);
    intervalo=null;
    esperaPausada=false;
    audio.pause();
    player.className="terminado";
    icono.textContent="⏹";
    contador.className="hidden";
    estadoPlayer.textContent=mensaje || "Toca para volver al menú.";
    btnSiguiente.textContent="⏭ Siguiente audio";
    btnSiguiente.style.display="none";
    btnExtra.style.display="none";
}

function reiniciarSesion(){
    detenido=false;
    fallosConsecutivos=0;
    clearInterval(intervalo);
    intervalo=null;
    clearInterval(intervaloExtra);
    intervaloExtra=null;
    tiempoExtra=0;
    enExtra=false;
    recuerdo=null;
    esperaPausada=false;
    accionesHechas=0;
    recompensaAbierta=false;
    recompensaAccion="espera";
    modalRecompensa.style.display="none";
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    audioExtra.pause();
    audioExtra.removeAttribute("src");
    audioExtra.load();
    btnSiguiente.textContent="⏭ Siguiente audio";
    btnExtra.style.display="none";
    icono.textContent="⏸";
    categoriaAudio.textContent="";
    categoriaAudio.className="";
    nombre.textContent="";
    estadoPlayer.textContent="";
    contador.className="hidden";
    btnSiguiente.style.display="none";
    configEl.style.display="flex";
}

audio.onended=()=>{
    if(pausadoManual || detenido) return;

    if(hayRecompensa()){
        mostrarRecompensa("espera");
        return;
    }

    programarSiguiente(minutosEspera);
};

audio.onerror=()=>{
    falloDeAudio();
};

audioExtra.onended=()=>{
    if(!enExtra) return;
    iniciarCuentaExtra();
};

audioExtra.onerror=()=>{
    if(!enExtra) return;
    salirDelExtra();
};

//---------------------------------------------
player.onclick=()=>{

    if(recompensaAbierta) return;

    if(detenido){
        reiniciarSesion();
        return;
    }

    if(enExtra){
        // Durante el extra, la pantalla controla el extra, no la partida.
        if(intervaloExtra!==null){
            clearInterval(intervaloExtra);
            intervaloExtra=null;
            player.className="paused";
            icono.textContent="▶";
            estadoPlayer.textContent="Acción extra en pausa";
            return;
        }

        if(tiempoExtra>0){
            player.className="esperando";
            icono.textContent="⏳";
            estadoPlayer.textContent="Termina la acción extra en";
            continuarCuentaExtra();
            return;
        }

        if(audioExtra.paused){
            audioExtra.play().catch(()=>salirDelExtra());
            player.className="playing";
            icono.textContent="⏸";
            estadoPlayer.textContent="Acción extra";
        }else{
            audioExtra.pause();
            player.className="paused";
            icono.textContent="▶";
            estadoPlayer.textContent="Acción extra en pausa";
        }
        return;
    }

    if(esperaPausada || player.className==="esperando"){
        // Pausar o reanudar la cuenta regresiva.
        if(tiempoRestante<=0) return;

        if(esperaPausada){
            esperaPausada=false;
            player.className="esperando";
            icono.textContent="⏳";
            estadoPlayer.textContent="Siguiente audio en";
            iniciarCuenta();
        }else{
            esperaPausada=true;
            clearInterval(intervalo);
            intervalo=null;
            player.className="paused";
            icono.textContent="▶";
            estadoPlayer.textContent="En pausa";
        }
        return;
    }

    if(audio.paused){
        audio.play();
        player.className="playing";
        icono.textContent="⏸";
        estadoPlayer.textContent="Reproduciendo";
        pausadoManual=false;
    }else{
        audio.pause();
        player.className="paused";
        icono.textContent="▶";
        estadoPlayer.textContent="Pausado";
        pausadoManual=true;
    }

};

btnSiguiente.onclick=(e)=>{
    e.stopPropagation();
    if(enExtra){
        salirDelExtra();
        return;
    }
    saltarAlSiguiente();
};

btnExtra.onclick=(e)=>{
    e.stopPropagation();
    entrarEnExtra();
};

//---------------------------------------------
btnIniciar.onclick=async()=>{

    const temas=temasElegidos.slice();
    const minutosValor=parseFloat(minutosInput.value);
    const proporcionValor=parseInt(proporcionInput.value,10);

    if(temas.length===0){
        configMsg.textContent="Elige al menos un tema.";
        return;
    }

    if(!minutosValor || minutosValor<=0){
        configMsg.textContent="Escribe un número válido de minutos (0.5 o más).";
        return;
    }

    if(!proporcionValor || proporcionValor<1){
        configMsg.textContent="Escribe un número válido de castigos inferiores por cada experto.";
        return;
    }

    minutosEspera=minutosValor;
    proporcion=proporcionValor;
    temasActuales=temas.slice();
    guardarCfg();
    configMsg.textContent="Cargando lista de audios...";
    btnIniciar.disabled=true;

    try{
        await cargarAudios(temas);
    }catch(e){
        configMsg.textContent="Error al cargar los audios. Revisa tu conexión.";
        btnIniciar.disabled=false;
        return;
    }

    if(listaPrincipiante.length===0 && listaAvanzado.length===0 && listaExperto.length===0 && colaUnaVez.length===0){
        configMsg.textContent="No se encontraron audios en esos temas.";
        btnIniciar.disabled=false;
        return;
    }

    barajaPrincipiante=[];
    ultimoPrincipiante=null;
    barajaAvanzado=[];
    ultimoAvanzado=null;
    barajaExperto=[];
    ultimoExperto=null;
    ultimoExtra=null;
    enExtra=false;
    recuerdo=null;
    clearInterval(intervaloExtra);
    intervaloExtra=null;
    tiempoExtra=0;
    accionesHechas=0;
    recompensaAbierta=false;
    recompensaAccion="espera";
    modalRecompensa.style.display="none";
    pasosCiclo=0;
    construirCiclo();
    pausadoManual=false;
    detenido=false;
    fallosConsecutivos=0;
    clearInterval(intervalo);
    intervalo=null;

    await mantenerPantalla();

    configEl.style.display="none";
    player.style.display="flex";
    player.className="";
    btnSiguiente.textContent="⏭ Siguiente audio";
    btnExtra.style.display=(listaExtras.length>0) ? "" : "none";

    avanzar();

};

cargarCfg();
iniciarTemas();

</script>
